name: Quality Gate

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-analyze:
    name: Unit Tests + JaCoCo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Init summary
        run: |
          echo "# PR Quality Report — $(date '+%Y-%m-%d %H:%M') UTC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| JaCoCo | Unit test coverage |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: Patch baseUri in capability files
        run: |
          TUTORIAL_DIR="modules/ikanos-engine/src/test/resources/tutorial"

          get_base_uri() {
            case "$1" in
              registry) echo "http://localhost:8080/rest/naftiko-shipyard-maritime-registry-api/1.0.0-alpha2" ;;
              legacy)   echo "http://localhost:8080/rest/naftiko-shipyard-legacy-dockyard-api/1.0.0-alpha2" ;;
              *)        echo "" ;;
            esac
          }

          find "$TUTORIAL_DIR" -name "*.yaml" -o -name "*.yml" | while read file; do
            COUNT=$(yq '.capability.consumes | length' "$file" 2>/dev/null)
            { [ -z "$COUNT" ] || [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; } && continue

            for i in $(seq 0 $(($COUNT - 1))); do
              IMPORT=$(yq -r ".capability.consumes[$i].import // \"\"" "$file")

              if [ -n "$IMPORT" ]; then
                # Import-style: patch the referenced shared file
                LOCATION=$(yq -r ".capability.consumes[$i].location" "$file")
                SHARED_FILE="$(dirname "$file")/$LOCATION"

                [ ! -f "$SHARED_FILE" ] && echo "Warning: $SHARED_FILE not found, skipping" && continue

                NAMESPACE=$(yq -r ".consumes[0].namespace" "$SHARED_FILE")
                BASE_URI=$(get_base_uri "$NAMESPACE")
                [ -z "$BASE_URI" ] && continue

                echo "Patching shared file $SHARED_FILE: '$NAMESPACE' → $BASE_URI"
                yq -i ".consumes[0].baseUri = \"$BASE_URI\"" "$SHARED_FILE"
              else
                # Inline-style: patch baseUri directly in the tutorial file
                NAMESPACE=$(yq -r ".capability.consumes[$i].namespace // \"\"" "$file")
                [ -z "$NAMESPACE" ] && continue

                BASE_URI=$(get_base_uri "$NAMESPACE")
                [ -z "$BASE_URI" ] && continue

                echo "Patching $file inline: '$NAMESPACE' → $BASE_URI"
                yq -i ".capability.consumes[$i].baseUri = \"$BASE_URI\"" "$file"
              fi
            done
          done

      - name: Prepare shared path
        run: ln -s modules/ikanos-engine/src/test/resources/tutorial/shared shared

      - name: Run tests + JaCoCo coverage
        run: mvn clean verify --no-transfer-progress

      - name: Publish test failures summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          REPORTS=$(find . -path "*/target/surefire-reports/TEST-*.xml")
          if [ -z "$REPORTS" ]; then
            echo "> No Surefire reports found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TOTAL=0; FAILURES=0; ERRORS=0; SKIPPED=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            read T FA ER SK < <(
              python3 -c "
          import xml.etree.ElementTree as ET
          import sys

          root = ET.parse(sys.argv[1]).getroot()
          print(
              root.get('tests','0'),
              root.get('failures','0'),
              root.get('errors','0'),
              root.get('skipped','0')
          )
          " "$f" 2>/dev/null
            )

            TOTAL=$((TOTAL + T))
            FAILURES=$((FAILURES + FA))
            ERRORS=$((ERRORS + ER))
            SKIPPED=$((SKIPPED + SK))
          done <<< "$REPORTS"
          PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))

          echo "| Passed | Failed | Errors | Skipped | Total |"  >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|----------|----------|-------|"        >> $GITHUB_STEP_SUMMARY
          echo "| $PASSED  | $FAILURES | $ERRORS  | $SKIPPED | $TOTAL |"     >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $((FAILURES + ERRORS)) -eq 0 ]; then
            echo "All tests passed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "### Failures & Errors" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET
          import os, glob

          reports = glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)
          found = 0

          for path in sorted(reports):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue

              classname = root.get("name", os.path.basename(path))

              for tc in root.findall("testcase"):
                  for tag in ("failure", "error"):
                      node = tc.find(tag)
                      if node is None:
                          continue
                      found += 1
                      test_name  = tc.get("name", "unknown")
                      error_type = node.get("type", tag)
                      message    = node.get("message", "").strip()
                      body       = (node.text or "").strip()

                      lines = body.splitlines()
                      trimmed = "\n".join(lines[:20])
                      if len(lines) > 20:
                          trimmed += f"\n... ({len(lines)-20} more lines)"

                      print(f"<details>")
                      print(f"<summary><b>[{tag.upper()}]</b> <code>{classname}</code> | <code>{test_name}</code></summary>")
                      print(f"")
                      print(f"**Type:** `{error_type}`  ")
                      if message:
                          print(f"**Message:** {message}  ")
                      print(f"")
                      print(f"```")
                      print(trimmed)
                      print(f"```")
                      print(f"</details>")
                      print(f"")

          if found == 0:
              print("_No detailed failure info found in XML reports._")
          PYEOF

      - name: Publish JaCoCo summary
        if: always()
        run: |
          CSV="modules/ikanos-coverage/target/site/jacoco-aggregate/jacoco.csv"
          {
            echo ""
            echo "## JaCoCo Coverage"
            echo ""
            if [ ! -f "$CSV" ]; then
              echo "> No coverage report found."
            else
              MISSED_LINES=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$8} END {print sum+0}')
              COVERED_LINES=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$9} END {print sum+0}')
              TOTAL=$((MISSED_LINES + COVERED_LINES))
              PCT=$([ "$TOTAL" -gt 0 ] && awk "BEGIN {printf \"%.1f\", ($COVERED_LINES/$TOTAL)*100}" || echo "0.0")
              MISSED_B=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$6} END {print sum+0}')
              COVERED_B=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$7} END {print sum+0}')
              TOTAL_B=$((MISSED_B + COVERED_B))
              PCT_B=$([ "$TOTAL_B" -gt 0 ] && awk "BEGIN {printf \"%.1f\", ($COVERED_B/$TOTAL_B)*100}" || echo "0.0")
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Line Coverage | **${PCT}%** (${COVERED_LINES} / ${TOTAL}) |"
              echo "| Branch Coverage | **${PCT_B}%** (${COVERED_B} / ${TOTAL_B}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: "modules/ikanos-coverage/target/site/jacoco-aggregate/"
          retention-days: 14
   
      - name: Metrics summary (non-main branches)
        if: github.ref != 'refs/heads/main'
        run: |
          CSV="modules/ikanos-coverage/target/site/jacoco-aggregate/jacoco.csv"

          if [ -f "$CSV" ]; then
            MISSED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$8} END {print sum+0}')
            COVERED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$9} END {print sum+0}')
            TOTAL=$((MISSED + COVERED))
            COV_PCT=$([ "$TOTAL" -gt 0 ] && awk "BEGIN {printf \"%.0f\", ($COVERED/$TOTAL)*100}" || echo "0")
          else
            COV_PCT="N/A"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Metrics (branch)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${COV_PCT}% |" >> $GITHUB_STEP_SUMMARY         

      - name: Generate badge JSON
        if: always()
        run: |
          # Each branch writes into its own subfolder on the badges branch, to avoid collisions
          BRANCH_SLUG=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mkdir -p "badges-output/${BRANCH_SLUG}"

          CSV="modules/ikanos-coverage/target/site/jacoco-aggregate/jacoco.csv"
          if [ -f "$CSV" ]; then
            MISSED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$8} END {print sum+0}')
            COVERED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$9} END {print sum+0}')
            TOTAL=$((MISSED + COVERED))
            COV_PCT=$([ "$TOTAL" -gt 0 ] && awk "BEGIN {printf \"%.0f\", ($COVERED/$TOTAL)*100}" || echo "0")
          else
            COV_PCT="N/A"
          fi

          if [ "$COV_PCT" != "N/A" ] && [ "$COV_PCT" -ge 80 ]; then
            COV_COLOR="brightgreen"
          elif [ "$COV_PCT" != "N/A" ] && [ "$COV_PCT" -ge 50 ]; then
            COV_COLOR="yellow"
          elif [ "$COV_PCT" = "N/A" ]; then
            COV_COLOR="lightgrey"
          else
            COV_COLOR="red"
          fi

          cat > "badges-output/${BRANCH_SLUG}/ikanos-coverage.json" <<EOF
          {"schemaVersion":1,"label":"coverage","message":"${COV_PCT}%","color":"${COV_COLOR}"}
          EOF

          echo "Generated: badges-output/${BRANCH_SLUG}/ikanos-coverage.json → ${COV_PCT}% (${COV_COLOR})"

      - name: Upload badge artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: badges-output
          path: badges-output/
          retention-days: 1

      - name: Build PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          CSV="modules/ikanos-coverage/target/site/jacoco-aggregate/jacoco.csv"
          if [ -f "$CSV" ]; then
            MISSED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$8} END {print sum+0}')
            COVERED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$9} END {print sum+0}')
            TOTAL=$((MISSED + COVERED))
            COV_PCT=$([ "$TOTAL" -gt 0 ] && awk "BEGIN {printf \"%.0f\", ($COVERED/$TOTAL)*100}" || echo "0")
          else
            COV_PCT="N/A"
          fi
          if [ "$COV_PCT" != "N/A" ] && [ "$COV_PCT" -ge 80 ]; then
            COV_ICON="✅"
          elif [ "$COV_PCT" = "N/A" ]; then
            COV_ICON="⚠️"
          else
            COV_ICON="❌"
          fi
          {
            echo "## 📊 Quality Gate Report — \`${HEAD_REF}\`"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Coverage | ${COV_ICON} ${COV_PCT}% |"
            echo ""
            echo "_Generated by the run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } > pr-comment-body.md

      - name: Save PR number
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload PR comment artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-comment
          path: |
            pr-comment-body.md
            pr-number.txt
          retention-days: 1

  security-scan:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest
    # Step order in this job matters: Trivy MUST run before Gitleaks.
    # Trivy writes its cache (.cache/trivy/) and its own report (trivy-report.json)
    # into the workspace, and both contain hex-looking data (DB blobs, the current
    # commit SHA in report metadata) that Gitleaks' heuristic rules can mistake for
    # secrets. Running Gitleaks second is intentional so those paths exist and can be
    # allowlisted in .github/workflows/.gitleaks.toml (see the entries for .cache/,
    # trivy-report.json and gitleaks-report.json) — swapping the order, or adding a
    # new Trivy/other-tool output file, without updating that allowlist will
    # reintroduce false positives (see #741 PR #756 history).

    steps:
      - uses: actions/checkout@v7

      - name: Init summary
        run: |
          echo "# Security Scan Report — $(date '+%Y-%m-%d %H:%M') UTC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | CVE vulnerabilities (CRITICAL/HIGH, unfixed ignored) |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | Secrets in the current working tree |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # Runs first (see the job-level note above): downloads its vulnerability DB
      # into .cache/trivy/ and writes trivy-report.json, both of which Gitleaks will
      # see and must ignore (allowlisted in .github/workflows/.gitleaks.toml).
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'

      - name: Publish Trivy summary
        id: trivy-summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Trivy Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f trivy-report.json ]; then
            echo "> No report found." >> $GITHUB_STEP_SUMMARY
            echo "trivy_findings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Report is already pre-filtered to CRITICAL/HIGH with ignore-unfixed by trivy-action.
          CRITICAL=$(grep -o '"Severity":"CRITICAL"' trivy-report.json | wc -l | tr -d ' ')
          HIGH=$(grep -o '"Severity":"HIGH"' trivy-report.json | wc -l | tr -d ' ')

          [ "$CRITICAL" -gt 0 ] && STATUS="❌ ${CRITICAL} critical issue(s)" \
            || { [ "$HIGH" -gt 0 ] && STATUS="❌ ${HIGH} high issue(s)" || STATUS="✅ No critical or high issues"; }

          echo "**${STATUS}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
          echo "| High     | ${HIGH} |" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Critical/High findings (unfixed vulnerabilities ignored)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Vulnerability ID | Severity | Installed | Fixed |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------------------|----------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              [.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")]
              | sort_by(if .Severity=="CRITICAL" then 0 else 1 end)
              | .[]
              | "| \(.PkgName) | \(.VulnerabilityID) | \(.Severity) | \(.InstalledVersion) | \(if (.FixedVersion // "") == "" then "n/a" else .FixedVersion end) |"
            ' trivy-report.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          echo "trivy_findings=$((CRITICAL + HIGH))" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 14

      - name: Install Gitleaks
        run: |
          mkdir -p /tmp/gitleaks-install
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -O /tmp/gitleaks-install/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks-install/gitleaks.tar.gz -C /tmp/gitleaks-install
          chmod +x /tmp/gitleaks-install/gitleaks
          sudo mv /tmp/gitleaks-install/gitleaks /usr/local/bin/
          gitleaks version

      # Runs after Trivy on purpose (see the job-level note above): `dir .` scans
      # the whole workspace, including .cache/trivy/ and trivy-report.json that the
      # previous step just created. Both are allowlisted in .gitleaks.toml — if this
      # step is ever reordered before Trivy, or Trivy starts writing to a new path,
      # revisit that allowlist.
      - name: Run Gitleaks scan
        run: |
          gitleaks dir . \
            --config .github/workflows/.gitleaks.toml \
            --gitleaks-ignore-path .github/workflows/.gitleaksignore \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 0 \
            --verbose

      - name: Publish Gitleaks summary
        id: gitleaks-summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Gitleaks Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f gitleaks-report.json ]; then
            echo "✅ No secrets detected." >> $GITHUB_STEP_SUMMARY
            echo "gitleaks_findings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(grep -o '"RuleID"' gitleaks-report.json | wc -l | tr -d ' ')

          if [ "$COUNT" -eq 0 ]; then
            echo "✅ No secrets detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **${COUNT} secret(s) detected in the working tree!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule | File |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          with open('gitleaks-report.json') as f:
            data = json.load(f)
          if isinstance(data, list):
            for item in data[:20]:
              rule = item.get('RuleID', 'N/A')
              file = item.get('File', 'N/A')
              print(f'| {rule} | {file} |')
          " >> $GITHUB_STEP_SUMMARY
          fi

          echo "gitleaks_findings=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14

      - name: Enforce security gate
        if: always()
        run: |
          TRIVY_FINDINGS="${{ steps.trivy-summary.outputs.trivy_findings }}"
          GITLEAKS_FINDINGS="${{ steps.gitleaks-summary.outputs.gitleaks_findings }}"

          if [ "${TRIVY_FINDINGS:-0}" -gt 0 ] || [ "${GITLEAKS_FINDINGS:-0}" -gt 0 ]; then
            echo "::error::Security gate failed — ${TRIVY_FINDINGS:-0} Trivy CRITICAL/HIGH finding(s), ${GITLEAKS_FINDINGS:-0} Gitleaks secret(s). See the job summary for details."
            exit 1
          fi

          echo "Security gate passed."
