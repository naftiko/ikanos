title = "Custom Gitleaks config"

[extend]
useDefault = true

# NOTE on ordering: quality-gate.yml's `security-scan` job runs Trivy BEFORE
# Gitleaks on purpose. Trivy leaves behind .cache/trivy/ (its vulnerability DB)
# and its scan reports (trivy-vuln-report.json, trivy-misconfig-report.json,
# merged into trivy-report.json), both scanned by Gitleaks'
# `dir .` right after. Their binary/metadata content (DB blobs, the current
# commit SHA) can match Gitleaks' heuristic rules — false positives, not real
# secrets. That's why they're allowlisted below. If the step order changes, a
# new Trivy output path is added, or another tool is inserted before Gitleaks,
# re-check this allowlist (history: #741 / PR #756).
[[allowlists]]
description = "Ignore heavy/generated directories and CI-generated scan report artifacts (they contain tool/commit metadata, not repo content)"
paths = [
  "^sonar-report/",
  "^target/",
  "^node_modules/",
  "^.git/",
  "^.cache/",
  "^trivy-.*\\.json$",
  "^gitleaks-report\\.json$"
]

[[allowlists]]
description = "Repo convention: values explicitly marked as fake/dummy/placeholder are not real secrets. Deliberately NOT word-boundary-anchored (\\bfake\\b): \\b never matches between two word characters, so it would silently stop matching this repo's own fixture convention (e.g. sk_test_FAKEKEY123, fakeApiKeyBackup) while doing nothing to prevent the false-negative it was meant to guard against."
regexes = [
  '''(?i)fake''',
  '''(?i)dummy''',
  '''(?i)placeholder''',
]

# SonarQube local scanner default admin:admin credentials, used only against
# localhost during the quality gate bootstrap - not a real credential.
[[rules]]
id = "curl-auth-user"
  [[rules.allowlists]]
  regexes = [ '''^admin:admin$''' ]
