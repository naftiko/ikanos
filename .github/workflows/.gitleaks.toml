title = "Custom Gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore heavy/generated directories and CI-generated scan report artifacts (they contain tool/commit metadata, not repo content)"
paths = [
  "^sonar-report/",
  "^target/",
  "^node_modules/",
  "^.git/",
  "^.cache/",
  "^trivy-report\\.json$",
  "^gitleaks-report\\.json$"
]

[[allowlists]]
description = "Repo convention: values explicitly marked as fake/dummy/placeholder are not real secrets"
regexes = [
  '''(?i)fake''',
  '''(?i)dummy''',
  '''(?i)placeholder''',
]

# SonarQube local scanner default admin:admin credentials, used only against
# localhost during the quality gate bootstrap - not a real credential.
[[rules]]
id = "curl-auth-user"
  [[rules.allowlists]]
  regexes = [ '''^admin:admin$''' ]
