name: Publish Maven to sonatype and GitHub Packages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      
      - name: Prepare shared path
        run: ln -s modules/ikanos-engine/src/test/resources/tutorial/shared shared

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish to GitHub Packages (release)
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  maven-central:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare shared path
        run: ln -s modules/ikanos-engine/src/test/resources/tutorial/shared shared

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Temporary workaround: ubuntu-latest now ships Maven 3.10.0, which breaks
      # central-publishing-maven-plugin (bundle uploaded without .pom files).
      # Remove once the plugin supports Maven 3.10.
      # See https://github.com/actions/runner-images/issues/14904
      - name: Pin Maven 3.9.16
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: 3.9.16

      - name: Configure Maven Central
        run: bash ./scripts/builder.sh config_maven_central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Configure GPG
        run: bash ./scripts/builder.sh config_gpg
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: bash ./scripts/builder.sh central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.gnupg
          rm -f ~/.m2/settings.xml


  github-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Prepare shared path
        run: ln -s modules/ikanos-engine/src/test/resources/tutorial/shared shared
        
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get version
        run: echo "VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_ENV

      - name: Publish snapshot
        if: contains(env.VERSION, 'SNAPSHOT')
        run: mvn --batch-mode -Dgpg.skip=true deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
