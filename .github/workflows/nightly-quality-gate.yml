name: Nightly Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
    
  test-and-analyze:
    name: Unit Tests + JaCoCo + SonarQube + Security
    runs-on: ubuntu-latest
    outputs:
      trivy_critical: ${{ steps.trivy-summary.outputs.trivy_critical }}
      trivy_high: ${{ steps.trivy-summary.outputs.trivy_high }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Init summary
        run: |
          echo "# PR Quality Report — $(date '+%Y-%m-%d %H:%M') UTC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| JaCoCo | Unit test coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| SonarQube | Code quality & bugs |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | CVE vulnerabilities & secrets |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | Secrets in the working tree |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      # Tutorial test fixtures already point to http://localhost:8080 (Refs #560).
      # The 'Patch baseUri' step has been removed.

      - name: Prepare shared path
        run: ln -s modules/ikanos-engine/src/test/resources/tutorial/shared shared

      - name: Run tests + JaCoCo coverage
        run: mvn clean verify --no-transfer-progress

      - name: Publish test failures summary
        if: ${{ !cancelled() }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          REPORTS=$(find . -path "*/target/surefire-reports/TEST-*.xml")
          if [ -z "$REPORTS" ]; then
            echo "> No Surefire reports found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TOTAL=0; FAILURES=0; ERRORS=0; SKIPPED=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            read T FA ER SK < <(
              python3 -c "
          import xml.etree.ElementTree as ET
          import sys

          root = ET.parse(sys.argv[1]).getroot()
          print(
              root.get('tests','0'),
              root.get('failures','0'),
              root.get('errors','0'),
              root.get('skipped','0')
          )
          " "$f" 2>/dev/null
            )

            TOTAL=$((TOTAL + T))
            FAILURES=$((FAILURES + FA))
            ERRORS=$((ERRORS + ER))
            SKIPPED=$((SKIPPED + SK))
          done <<< "$REPORTS"
          PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))

          echo "| Passed | Failed | Errors | Skipped | Total |"  >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|----------|----------|-------|"        >> $GITHUB_STEP_SUMMARY
          echo "| $PASSED  | $FAILURES | $ERRORS  | $SKIPPED | $TOTAL |"     >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $((FAILURES + ERRORS)) -eq 0 ]; then
            echo "All tests passed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "### Failures & Errors" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET
          import os, glob

          reports = glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)
          found = 0

          for path in sorted(reports):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue

              classname = root.get("name", os.path.basename(path))

              for tc in root.findall("testcase"):
                  for tag in ("failure", "error"):
                      node = tc.find(tag)
                      if node is None:
                          continue
                      found += 1
                      test_name  = tc.get("name", "unknown")
                      error_type = node.get("type", tag)
                      message    = node.get("message", "").strip()
                      body       = (node.text or "").strip()

                      lines = body.splitlines()
                      trimmed = "\n".join(lines[:20])
                      if len(lines) > 20:
                          trimmed += f"\n... ({len(lines)-20} more lines)"

                      print(f"<details>")
                      print(f"<summary><b>[{tag.upper()}]</b> <code>{classname}</code> | <code>{test_name}</code></summary>")
                      print(f"")
                      print(f"**Type:** `{error_type}`  ")
                      if message:
                          print(f"**Message:** {message}  ")
                      print(f"")
                      print(f"```")
                      print(trimmed)
                      print(f"```")
                      print(f"</details>")
                      print(f"")

          if found == 0:
              print("_No detailed failure info found in XML reports._")
          PYEOF

      - name: Publish JaCoCo summary
        if: ${{ !cancelled() }}
        run: |
          CSV="modules/ikanos-coverage/target/site/jacoco-aggregate/jacoco.csv"
          {
            echo ""
            echo "## JaCoCo Coverage"
            echo ""
            if [ ! -f "$CSV" ]; then
              echo "> No coverage report found."
            else
              MISSED_LINES=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$8} END {print sum+0}')
              COVERED_LINES=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$9} END {print sum+0}')
              TOTAL=$((MISSED_LINES + COVERED_LINES))
              PCT=$([ "$TOTAL" -gt 0 ] && awk "BEGIN {printf \"%.1f\", ($COVERED_LINES/$TOTAL)*100}" || echo "0.0")
              MISSED_B=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$6} END {print sum+0}')
              COVERED_B=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$7} END {print sum+0}')
              TOTAL_B=$((MISSED_B + COVERED_B))
              PCT_B=$([ "$TOTAL_B" -gt 0 ] && awk "BEGIN {printf \"%.1f\", ($COVERED_B/$TOTAL_B)*100}" || echo "0.0")
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Line Coverage | **${PCT}%** (${COVERED_LINES} / ${TOTAL}) |"
              echo "| Branch Coverage | **${PCT_B}%** (${COVERED_B} / ${TOTAL_B}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jacoco-report
          path: "modules/ikanos-coverage/target/site/jacoco-aggregate/"
          retention-days: 14

      - name: Start SonarQube
        run: |
          docker run -d --name sonarqube \
            -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community

      - name: Wait for SonarQube
        run: |
          for i in $(seq 1 40); do
            STATUS=$(curl -s http://localhost:9000/api/system/status 2>/dev/null \
              | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
            echo "Attempt $i — status: $STATUS"
            [ "$STATUS" = "UP" ] && echo "SonarQube is UP!" && break
            sleep 10 # Wait before retry to allow startup completion
          done

      - name: Generate SonarQube token
        run: |
          curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-token&type=GLOBAL_ANALYSIS_TOKEN" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4 > /tmp/sonar_token.txt

      - name: SonarQube Scan
        run: |
          SONAR_TOKEN=$(cat /tmp/sonar_token.txt | tr -d '[:space:]')
          docker run --rm \
            --network="host" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=io.naftiko:ikanos \
            -Dsonar.sources=modules/ikanos-spec/src/main/java,modules/ikanos-engine/src/main/java,modules/ikanos-cli/src/main/java \
            -Dsonar.java.binaries=modules/ikanos-spec/target/classes,modules/ikanos-engine/target/classes,modules/ikanos-cli/target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=modules/ikanos-coverage/target/site/jacoco-aggregate/jacoco.xml \
            -Dsonar.host.url=http://localhost:9000

      - name: Export + Publish SonarQube summary
        if: ${{ !cancelled() }}
        run: |
          # Wait 15s for SonarQube to process the analysis results
          sleep 15 
          mkdir -p sonar-report
          AUTH="admin:admin"
          PROJECT="io.naftiko:ikanos"
          BASE="http://localhost:9000"

          curl -s -u $AUTH "$BASE/api/measures/component?component=$PROJECT&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc" -o sonar-report/measures.json
          curl -s -u $AUTH "$BASE/api/qualitygates/project_status?projectKey=$PROJECT" -o sonar-report/quality-gate.json
          curl -s -u $AUTH "$BASE/api/issues/search?componentKeys=$PROJECT&ps=500" -o sonar-report/issues.json

          echo "=== measures.json ===" && cat sonar-report/measures.json
          echo "=== quality-gate.json ===" && cat sonar-report/quality-gate.json

          QG=$(python3 -c "import json; d=json.load(open('sonar-report/quality-gate.json')); print(d['projectStatus']['status'])" 2>/dev/null || echo "NONE")
          BUGS=$(python3 -c "import json; d=json.load(open('sonar-report/measures.json')); print(next((m['value'] for m in d['component']['measures'] if m['metric']=='bugs'), '0'))" 2>/dev/null || echo "0")
          VULNS=$(python3 -c "import json; d=json.load(open('sonar-report/measures.json')); print(next((m['value'] for m in d['component']['measures'] if m['metric']=='vulnerabilities'), '0'))" 2>/dev/null || echo "0")
          SMELLS=$(python3 -c "import json; d=json.load(open('sonar-report/measures.json')); print(next((m['value'] for m in d['component']['measures'] if m['metric']=='code_smells'), '0'))" 2>/dev/null || echo "0")
          COVERAGE=$(python3 -c "import json; d=json.load(open('sonar-report/measures.json')); print(next((m['value'] for m in d['component']['measures'] if m['metric']=='coverage'), 'N/A'))" 2>/dev/null || echo "N/A")
          DUPL=$(python3 -c "import json; d=json.load(open('sonar-report/measures.json')); print(next((m['value'] for m in d['component']['measures'] if m['metric']=='duplicated_lines_density'), 'N/A'))" 2>/dev/null || echo "N/A")
          NCLOC=$(python3 -c "import json; d=json.load(open('sonar-report/measures.json')); print(next((m['value'] for m in d['component']['measures'] if m['metric']=='ncloc'), 'N/A'))" 2>/dev/null || echo "N/A")
          echo "Parsed: QG=$QG BUGS=$BUGS VULNS=$VULNS SMELLS=$SMELLS COVERAGE=$COVERAGE"

          [ "$QG" = "OK" ] && QG_BADGE="✅ PASSED" || QG_BADGE="❌ FAILED"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Quality Gate: ${QG_BADGE}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bugs | ${BUGS:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerabilities | ${VULNS:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Smells | ${SMELLS:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${COVERAGE:-N/A}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Duplications | ${DUPL:-N/A}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Lines of Code | ${NCLOC:-N/A} |" >> $GITHUB_STEP_SUMMARY

          cat > /tmp/sonar_metrics.env << EOF
          QG=$QG
          BUGS=$BUGS
          VULNS=$VULNS
          SMELLS=$SMELLS
          EOF

      - name: Upload SonarQube report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: sonarqube-report
          path: sonar-report/
          retention-days: 14

      - name: Generate SBOM (CycloneDX)
        id: sbom
        if: ${{ !cancelled() }}
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -DoutputName=bom --no-transfer-progress

      - name: CVE scan (dependencies)
        id: cve
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        uses: naftiko/.github/.github/actions/cve-scan@68459debbaafdba1ef3b9c7111544c0e43ff2b59 # naftiko/.github#6
        with:
          scan-type: sbom
          scan-ref: target/bom.json
          min-packages: "160"  # ~80% of the 200 packages measured on 2026-10-16
          ignore-unfixed: "false"
          misconfig-severity: HIGH,CRITICAL
          misconfig-ref: deployment/Dockerfile

      # The image that ships (same Dockerfile as publish-engine-image.yml), so a release
      # no longer discovers CVEs the nightly never saw.
      - name: Build image
        id: build
        if: ${{ !cancelled() }}
        run: docker build -f deployment/Dockerfile -t scan-local/ikanos:nightly .

      - name: CVE scan (image)
        id: cve_image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: naftiko/.github/.github/actions/cve-scan@68459debbaafdba1ef3b9c7111544c0e43ff2b59 # naftiko/.github#6
        with:
          scan-type: image
          scan-ref: scan-local/ikanos:nightly
          min-packages: "140"  # ~80% of the 177 packages measured on 2026-10-16
          ignore-unfixed: "false"

      - name: Count findings
        id: trivy-summary
        if: ${{ !cancelled() }}
        env:
          VULN_CRITICAL: ${{ steps.cve.outputs.critical }}
          VULN_HIGH: ${{ steps.cve.outputs.high }}
          MISCONFIG_CRITICAL: ${{ steps.cve.outputs.misconfig-critical }}
          MISCONFIG_HIGH: ${{ steps.cve.outputs.misconfig-high }}
          IMAGE_CRITICAL: ${{ steps.cve_image.outputs.critical }}
          IMAGE_HIGH: ${{ steps.cve_image.outputs.high }}
          CVE_OUTCOME: ${{ steps.cve.outcome }}
          IMAGE_OUTCOME: ${{ steps.cve_image.outcome }}
        run: |
          CRITICAL=$(( ${VULN_CRITICAL:-0} + ${MISCONFIG_CRITICAL:-0} + ${IMAGE_CRITICAL:-0} ))
          HIGH=$(( ${VULN_HIGH:-0} + ${MISCONFIG_HIGH:-0} + ${IMAGE_HIGH:-0} ))
          # The counters are 0 when a gate fails on something other than findings (empty or
          # partial scan, Trivy error, skipped scan, failed build): the outcome lets the badge say so.
          OUTCOME=failure
          [ "$CVE_OUTCOME" = "success" ] && [ "$IMAGE_OUTCOME" = "success" ] && OUTCOME=success
          {
            echo "TRIVY_CRITICAL=$CRITICAL"
            echo "TRIVY_HIGH=$HIGH"
            echo "TRIVY_OUTCOME=${OUTCOME}"
          } > /tmp/trivy_metrics.env
          echo "trivy_critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "trivy_high=$HIGH" >> "$GITHUB_OUTPUT"

      # `if: !cancelled()` on the steps below: a failing CVE gate must not skip them.
      - name: Install Gitleaks
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/gitleaks-install
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -O /tmp/gitleaks-install/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks-install/gitleaks.tar.gz -C /tmp/gitleaks-install
          chmod +x /tmp/gitleaks-install/gitleaks
          sudo mv /tmp/gitleaks-install/gitleaks /usr/local/bin/
          gitleaks version
 
      - name: Run Gitleaks scan
        if: ${{ !cancelled() }}
        run: |
          gitleaks dir . \
            --config .github/workflows/.gitleaks.toml \
            --gitleaks-ignore-path .github/workflows/.gitleaksignore \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 0 \
            --verbose

      - name: Publish Gitleaks summary
        if: ${{ !cancelled() }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Gitleaks Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f gitleaks-report.json ]; then
            echo "✅ No secrets detected." >> $GITHUB_STEP_SUMMARY
            echo "LEAKS_COUNT=0" > /tmp/gitleaks_metrics.env
            exit 0
          fi

          COUNT=$(grep -o '"RuleID"' gitleaks-report.json | wc -l | tr -d ' ')

          if [ "$COUNT" -eq 0 ]; then
            echo "✅ No secrets detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **${COUNT} secret(s) detected in the working tree!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule | File |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json, sys
          with open('gitleaks-report.json') as f:
            data = json.load(f)
          if isinstance(data, list):
            for item in data[:10]:
              rule = item.get('RuleID', 'N/A')
              file = item.get('File', 'N/A')
              print(f'| {rule} | {file} |')
          " >> $GITHUB_STEP_SUMMARY
          fi

          echo "LEAKS_COUNT=$COUNT" > /tmp/gitleaks_metrics.env

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14

      - name: Metrics summary
        if: ${{ !cancelled() }}
        run: |
          source /tmp/sonar_metrics.env 2>/dev/null || true
          source /tmp/trivy_metrics.env 2>/dev/null || true
          source /tmp/gitleaks_metrics.env 2>/dev/null || true

          CSV="modules/ikanos-coverage/target/site/jacoco-aggregate/jacoco.csv"

          if [ -f "$CSV" ]; then
            MISSED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$8} END {print sum+0}')
            COVERED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$9} END {print sum+0}')
            TOTAL=$((MISSED + COVERED))
            COV_PCT=$([ "$TOTAL" -gt 0 ] && awk "BEGIN {printf \"%.0f\", ($COVERED/$TOTAL)*100}" || echo "0")
          else
            COV_PCT="N/A"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${COV_PCT}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Bugs | ${BUGS:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerabilities | ${VULNS:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Smells | ${SMELLS:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Critical | ${TRIVY_CRITICAL:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${LEAKS_COUNT:-0} |" >> $GITHUB_STEP_SUMMARY    

      - name: Generate badge JSON
        if: ${{ !cancelled() }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          BRANCH_SLUG=$(echo "$REF_NAME" | tr '/' '-')
          mkdir -p "badges-output/${BRANCH_SLUG}"
          source /tmp/sonar_metrics.env 2>/dev/null || true
          source /tmp/trivy_metrics.env 2>/dev/null || true
          source /tmp/gitleaks_metrics.env 2>/dev/null || true

          # Load JaCoCo coverage
          CSV="modules/ikanos-coverage/target/site/jacoco-aggregate/jacoco.csv"
          if [ -f "$CSV" ]; then
            MISSED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$8} END {print sum+0}')
            COVERED=$(tail -n +2 "$CSV" | awk -F',' '{sum+=$9} END {print sum+0}')
            TOTAL=$((MISSED + COVERED))
            COV_PCT=$([ "$TOTAL" -gt 0 ] && awk "BEGIN {printf \"%.0f\", ($COVERED/$TOTAL)*100}" || echo "0")
          else
            COV_PCT="N/A"
          fi

          if [ "$COV_PCT" != "N/A" ] && [ "$COV_PCT" -ge 80 ]; then
            COV_COLOR="brightgreen"
          elif [ "$COV_PCT" != "N/A" ] && [ "$COV_PCT" -ge 50 ]; then
            COV_COLOR="yellow"
          elif [ "$COV_PCT" = "N/A" ]; then
            COV_COLOR="lightgrey"
          else
            COV_COLOR="red"
          fi

          # Sonar Quality Gate badge
          if [ "${QG:-NONE}" = "OK" ]; then
            QG_MSG="passed"
            QG_COLOR="brightgreen"
          else
            QG_MSG="failed"
            QG_COLOR="red"
          fi

          # Sonar bugs badge
          if [ "${BUGS:-0}" = "0" ]; then
            BUGS_COLOR="brightgreen"
          else
            BUGS_COLOR="red"
          fi

          # Trivy badge
          CRIT="${TRIVY_CRITICAL:-0}"; HIGH_CNT="${TRIVY_HIGH:-0}"
          if [ "$CRIT" -gt 0 ]; then
            TRIVY_MSG="${CRIT} critical"; TRIVY_COLOR="red"
          elif [ "$HIGH_CNT" -gt 0 ]; then
            TRIVY_MSG="${HIGH_CNT} high"; TRIVY_COLOR="orange"
          elif [ "${TRIVY_OUTCOME:-unknown}" != "success" ]; then
            TRIVY_MSG="scan failed"; TRIVY_COLOR="red"
          else
            TRIVY_MSG="clean"; TRIVY_COLOR="brightgreen"
          fi

          # Gitleaks badge — use LEAKS_COUNT (sourced from gitleaks_metrics.env)
          LEAKS_COUNT="${LEAKS_COUNT:-0}"
          if [ "$LEAKS_COUNT" -eq 0 ]; then
            LEAKS_MSG="no secrets"
            LEAKS_COLOR="brightgreen"
          else
            LEAKS_MSG="${LEAKS_COUNT} secrets"
            LEAKS_COLOR="red"
          fi

          write_badge() {
            local filename="$1" label="$2" message="$3" color="$4"
            cat > "badges-output/${BRANCH_SLUG}/${filename}" <<EOF
          {"schemaVersion":1,"label":"${label}","message":"${message}","color":"${color}"}
          EOF
            echo "Generated: badges-output/${BRANCH_SLUG}/${filename} → ${message} (${color})"
          }

          write_badge "ikanos-coverage.json"     "coverage"      "${COV_PCT}%"   "$COV_COLOR"
          write_badge "ikanos-quality-gate.json" "quality gate"  "$QG_MSG"       "$QG_COLOR"
          write_badge "ikanos-bugs.json"         "bugs"          "${BUGS:-0}"    "$BUGS_COLOR"
          write_badge "ikanos-trivy.json"        "trivy"         "$TRIVY_MSG"    "$TRIVY_COLOR"
          write_badge "ikanos-gitleaks.json"     "gitleaks"      "$LEAKS_MSG"    "$LEAKS_COLOR"

      - name: Deploy badges to badges branch
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges-output
          publish_branch: badges
          destination_dir: .
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  integration-tests:
    uses: ./.github/workflows/validate-tuto-examples.yml
    secrets: inherit

  smoke-tests:
    uses: ./.github/workflows/publish-cli-bin.yml
    secrets: inherit

  nightly-report:
    name: Nightly Report
    needs:
        - test-and-analyze
        - integration-tests
        - smoke-tests

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Build report
        run: |
            echo "# Nightly Smoke Test Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY

            echo "| Quality Gate | ${{ needs.test-and-analyze.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| CLI Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
            
  notify-on-failure-or-vulnerabilities:
      name: Slack notification on failure or vulnerability finding
      needs:
        - test-and-analyze
        - integration-tests
        - smoke-tests
      # The CVE gate fails test-and-analyze, so `failure` covers findings and infrastructure errors.
      if: |
        always() && !startsWith(github.ref_name, 'dependabot/') && (
          needs.test-and-analyze.result == 'failure' ||
          needs.integration-tests.result == 'failure' ||
          needs.smoke-tests.result == 'failure'
        )
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions:
        pull-requests: read
      steps:
        # Drafts are still tested nightly, but their failures no longer alert Slack.
        - name: Detect draft pull request
          id: draft
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            REPO: ${{ github.repository }}
            OWNER: ${{ github.repository_owner }}
            BRANCH: ${{ github.ref_name }}
          run: |
            IS_DRAFT=$(gh api -X GET "repos/$REPO/pulls" \
              -f head="$OWNER:$BRANCH" \
              -f state=open \
              --jq 'length > 0 and all(.[]; .draft)') || {
              echo "::warning::Draft detection failed, notifying anyway"
              IS_DRAFT=false
            }
            echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"

        - name: Send Slack notification
          if: steps.draft.outputs.is_draft != 'true'
          env:
            REPOSITORY: ${{ github.repository }}
            BRANCH: ${{ github.ref_name }}
            QUALITY_GATE_RESULT: ${{ needs.test-and-analyze.result }}
            INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
            SMOKE_TESTS_RESULT: ${{ needs.smoke-tests.result }}
            TRIVY_CRITICAL: ${{ needs.test-and-analyze.outputs.trivy_critical }}
            TRIVY_HIGH: ${{ needs.test-and-analyze.outputs.trivy_high }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          run: |
            if [ -z "$SLACK_WEBHOOK_URL" ]; then
              echo "::error::SLACK_WEBHOOK_URL secret is not set: cannot deliver this notification."
              exit 1
            fi

            if [ "${TRIVY_CRITICAL:-0}" -gt 0 ] || [ "${TRIVY_HIGH:-0}" -gt 0 ]; then
              TEXT="❌ *Nightly Quality Gate: security findings*"
            else
              TEXT="❌ *Nightly Quality Gate failed*"
            fi
            COLOR="danger"

            # Context values (BRANCH may legally contain characters like `'` in a Git ref name) go through
            # `env` and are encoded with jq --arg, never interpolated into the JSON literal or the shell.
            PAYLOAD=$(jq -n \
              --arg text "$TEXT" \
              --arg color "$COLOR" \
              --arg repository "$REPOSITORY" \
              --arg branch "$BRANCH" \
              --arg qualityGateResult "$QUALITY_GATE_RESULT" \
              --arg integrationTestsResult "$INTEGRATION_TESTS_RESULT" \
              --arg smokeTestsResult "$SMOKE_TESTS_RESULT" \
              --arg trivyCritical "$TRIVY_CRITICAL" \
              --arg trivyHigh "$TRIVY_HIGH" \
              --arg runUrl "$RUN_URL" \
              '{
                text: $text,
                attachments: [
                  {
                    color: $color,
                    fallback: $text,
                    fields: [
                      { title: "Repository", value: $repository, short: true },
                      { title: "Branch", value: $branch, short: true },
                      { title: "Quality Gate", value: $qualityGateResult, short: true },
                      { title: "Integration Tests", value: $integrationTestsResult, short: true },
                      { title: "CLI Smoke Tests", value: $smokeTestsResult, short: true },
                      { title: "Trivy Critical", value: $trivyCritical, short: true },
                      { title: "Trivy High", value: $trivyHigh, short: true }
                    ],
                    actions: [
                      { type: "button", name: "view_run", text: "View Run", url: $runUrl }
                    ]
                  }
                ]
              }')

            # --fail-with-body makes curl exit non-zero on an HTTP 4xx/5xx response (and prints Slack's
            # error body), so a rejected webhook fails the job instead of looking successful.
            # --max-time bounds a stalled connection.
            curl --fail-with-body --max-time 15 -sS -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
