name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  jlink-packages:
    name: Publish CLI Packages (jlink)
    uses: ./.github/workflows/publish-cli-packages.yml
    secrets: inherit

  # The one job that creates the release, once the packages are built and tested: a tag never
  # goes out with nothing for install.sh, which installs the newest release. JReleaser publishes
  # the four packages and a .sha256 per file (jreleaser.yml); the notes are written by hand, as
  # before. It refuses to start when one platform's package is missing.
  release:
    name: Create GitHub Release
    needs:
      - jlink-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history, with the tags: JReleaser reads the release's tag and its commit.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The four packages, each put where its jreleaser.yml assembler writes it: the three .tar.gz
      # of ikanos-cli, and the Windows .zip of ikanos-cli-windows. JReleaser writes their .sha256
      # files again, the same way.
      - name: Download the macOS and Linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: ikanos-cli-*.tar.gz
          path: out/jreleaser/assemble/ikanos-cli/jlink
          merge-multiple: true

      - name: Download the Windows package
        uses: actions/download-artifact@v8
        with:
          pattern: ikanos-cli-windows-*.zip
          path: out/jreleaser/assemble/ikanos-cli-windows/jlink
          merge-multiple: true

      # The version is the tag's: v1.0.0-beta10 releases 1.0.0-beta10, a pre-release.
      - name: Choose the version
        run: echo "JRELEASER_PROJECT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff # v2
        with:
          version: 1.26.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # JReleaser leaves the release a draft (draft: true in jreleaser.yml): it is published only
      # now that every file is on it. A final release becomes the latest; a beta stays a pre-release.
      - name: Publish the draft
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Keep JReleaser's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-release-log
          path: out/jreleaser/trace.log
          retention-days: 7

  publish-installer:
    name: Publish installer scripts to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Stage installer scripts (latest alias + frozen per-tag path)
        run: |
          mkdir -p pages-stage
          cp docs/install.sh pages-stage/install.sh
          cp docs/install.ps1 pages-stage/install.ps1
          mkdir -p "pages-stage/${{ github.ref_name }}"
          cp docs/install.sh "pages-stage/${{ github.ref_name }}/install.sh"
          cp docs/install.ps1 "pages-stage/${{ github.ref_name }}/install.ps1"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-stage
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
