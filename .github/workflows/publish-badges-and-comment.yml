name: Publish Badges and Comment

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    # Fork runs are untrusted input for a job with write permissions: we skip them
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download badge artifact
        uses: actions/download-artifact@v8
        with:
          name: badges-output
          path: badges-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy badges to badges branch
        uses: naftiko/.github/.github/actions/deploy-badges@0350704a80b6163ae2b46862796952e69584374e # naftiko/.github#7

      - name: Download PR comment artifact
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        if: github.event.workflow_run.event == 'pull_request'
        id: pr
        run: echo "number=$(cat pr-number.txt)" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: github.event.workflow_run.event == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: quality-gate-report
          number: ${{ steps.pr.outputs.number }}
          path: pr-comment-body.md
