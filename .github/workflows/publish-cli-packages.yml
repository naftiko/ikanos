name: Publish CLI Packages

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'modules/ikanos-*/pom.xml'
      - 'docs/install.sh'
      - 'docs/install.ps1'
      - '.github/workflows/publish-cli-packages.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  build-package:
    name: Build package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - os: macos-latest  # macos-14+ uses Mx runners
            artifact_name: ikanos-cli-macos-arm64.tar.gz

          # Linux AMD64
          - os: ubuntu-latest
            artifact_name: ikanos-cli-linux-amd64.tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            artifact_name: ikanos-cli-linux-arm64.tar.gz

          # Windows AMD64
          - os: windows-latest
            artifact_name: ikanos-cli-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build shaded jar with Maven
        shell: bash
        run: mvn -B clean package -pl modules/ikanos-cli -am -DskipTests

      - name: Build custom JRE with jlink (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          MODS=$(jdeps --print-module-deps -R --ignore-missing-deps modules/ikanos-cli/target/ikanos.jar)
          if [ -z "$MODS" ]; then
            echo "FAIL: jdeps produced no module list — check ikanos.jar exists and is valid"
            exit 1
          fi
          echo "Detected modules: $MODS"

          jlink \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules "$MODS" \
            --bind-services \
            --output "$RUNNER_TEMP/ikanos-jre"

      - name: Build custom JRE with jlink (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $MODS = jdeps --print-module-deps -R --ignore-missing-deps modules/ikanos-cli/target/ikanos.jar
          if ([string]::IsNullOrWhiteSpace($MODS)) {
            Write-Error "FAIL: jdeps produced no module list — check ikanos.jar exists and is valid"
            exit 1
          }
          Write-Host "Detected modules: $MODS"

          jlink `
            --module-path "$env:JAVA_HOME\jmods" `
            --add-modules "$MODS" `
            --bind-services `
            --output "$env:RUNNER_TEMP\ikanos-jre"

      - name: Stage archive contents — jre/ + ikanos.jar at top level (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/ikanos-package-stage"
          mkdir -p "$STAGE"
          cp -R "$RUNNER_TEMP/ikanos-jre" "$STAGE/jre"
          cp modules/ikanos-cli/target/ikanos.jar "$STAGE/ikanos.jar"

          # Sanity check: the wrapper script generated by install.sh expects
          # exactly these two top-level entries — fail fast if that ever drifts.
          ls "$STAGE"
          test -x "$STAGE/jre/bin/java" || { echo "FAIL: jre/bin/java missing or not executable"; exit 1; }
          test -f "$STAGE/ikanos.jar" || { echo "FAIL: ikanos.jar missing"; exit 1; }

      - name: Stage archive contents — jre/ + ikanos.jar at top level (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $STAGE = "$env:RUNNER_TEMP\ikanos-package-stage"
          New-Item -ItemType Directory -Force -Path $STAGE | Out-Null
          Copy-Item -Recurse "$env:RUNNER_TEMP\ikanos-jre" "$STAGE\jre"
          Copy-Item modules\ikanos-cli\target\ikanos.jar "$STAGE\ikanos.jar"

          # Sanity check: the wrapper generated by install.ps1 expects exactly
          # these two top-level entries — fail fast if that ever drifts.
          Get-ChildItem $STAGE
          if (-not (Test-Path "$STAGE\jre\bin\java.exe")) {
            Write-Error "FAIL: jre\bin\java.exe missing"
            exit 1
          }
          if (-not (Test-Path "$STAGE\ikanos.jar")) {
            Write-Error "FAIL: ikanos.jar missing"
            exit 1
          }

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p modules/ikanos-cli/target/packages
          tar czf "modules/ikanos-cli/target/packages/${{ matrix.artifact_name }}" \
            -C "$RUNNER_TEMP/ikanos-package-stage" jre ikanos.jar

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path modules\ikanos-cli\target\packages | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP\ikanos-package-stage\*" `
            -DestinationPath "modules\ikanos-cli\target\packages\${{ matrix.artifact_name }}" -Force

      - name: Smoke test the package — extract + run --version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TESTDIR="$RUNNER_TEMP/ikanos-package-smoketest"
          mkdir -p "$TESTDIR"
          tar xzf "modules/ikanos-cli/target/packages/${{ matrix.artifact_name }}" -C "$TESTDIR"
          "$TESTDIR/jre/bin/java" -jar "$TESTDIR/ikanos.jar" --version

      - name: Smoke test the package — extract + run --version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TESTDIR = "$env:RUNNER_TEMP\ikanos-package-smoketest"
          New-Item -ItemType Directory -Force -Path $TESTDIR | Out-Null
          Expand-Archive -Path "modules\ikanos-cli\target\packages\${{ matrix.artifact_name }}" -DestinationPath $TESTDIR -Force
          & "$TESTDIR\jre\bin\java.exe" -jar "$TESTDIR\ikanos.jar" --version

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        working-directory: modules/ikanos-cli/target/packages
        shell: bash
        run: shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = Get-FileHash modules\ikanos-cli\target\packages\${{ matrix.artifact_name }} -Algorithm SHA256
          $line = "$($hash.Hash.ToLower())  ${{ matrix.artifact_name }}`n"
          $out = Join-Path $env:GITHUB_WORKSPACE "modules/ikanos-cli/target/packages/${{ matrix.artifact_name }}.sha256"
          [System.IO.File]::WriteAllText($out, $line, (New-Object System.Text.UTF8Encoding($false)))

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            modules/ikanos-cli/target/packages/${{ matrix.artifact_name }}
            modules/ikanos-cli/target/packages/${{ matrix.artifact_name }}.sha256

  test-package:
    name: Test package on ${{ matrix.os }}
    needs: build-package
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: ikanos-cli-macos-arm64.tar.gz
          - os: ubuntu-latest
            artifact_name: ikanos-cli-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            artifact_name: ikanos-cli-linux-arm64.tar.gz
          - os: windows-latest
            artifact_name: ikanos-cli-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: ./pkg

      - name: Verify checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ./pkg
        run: shasum -a 256 -c ${{ matrix.artifact_name }}.sha256

      - name: Verify checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = (Get-Content "./pkg/${{ matrix.artifact_name }}.sha256" -Raw).Split(' ')[0].Trim().ToLower()
          $actual = (Get-FileHash "./pkg/${{ matrix.artifact_name }}" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "Checksum mismatch: expected $expected, got $actual"
          }

      - name: Install via install.sh (real script, mock release endpoint) (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8931 --directory ./pkg --bind 127.0.0.1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:8931/${{ matrix.artifact_name }}.sha256" >/dev/null 2>&1 && break
            sleep 0.5
          done

          IKANOS_HOME="$RUNNER_TEMP/ikanos-home" \
          IKANOS_NO_MODIFY_RC=1 \
          IKANOS_VERSION="v0.0.0-local-ci" \
          IKANOS_BASE_URL="http://127.0.0.1:8931" \
            sh docs/install.sh
          echo "$RUNNER_TEMP/ikanos-home/bin" >> "$GITHUB_PATH"
          echo "IKANOS_HOME=$RUNNER_TEMP/ikanos-home" >> "$GITHUB_ENV"

      - name: Install via install.ps1 (real script, mock release endpoint) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgDir = Join-Path (Get-Location) "pkg"
          $proc = Start-Process -FilePath "python" -ArgumentList "-m","http.server","8931","--directory","$pkgDir","--bind","127.0.0.1" -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 20; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8931/${{ matrix.artifact_name }}.sha256" | Out-Null
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }

            $env:IKANOS_HOME = "$env:RUNNER_TEMP\ikanos-home"
            $env:IKANOS_NO_MODIFY_PATH = "1"
            $env:IKANOS_VERSION = "v0.0.0-local-ci"
            $env:IKANOS_BASE_URL = "http://127.0.0.1:8931"
            & .\docs\install.ps1

            Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ikanos-home\bin"
            Add-Content -Path $env:GITHUB_ENV -Value "IKANOS_HOME=$env:RUNNER_TEMP\ikanos-home"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: CLI is on PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          command -v ikanos
          ikanos --version

      - name: CLI is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command ikanos
          ikanos --version

      - name: Test create + validate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf "test\nhttps://api.com\n8080\n" | ikanos create capability
          ikanos v test.ikanos.yaml

      - name: Test create + validate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "test`nhttps://api.com`n8080`n" | ikanos create capability
          ikanos v test.ikanos.yaml

      # --- jlink module-set regression guard --------------------------------
      # Ensures the custom runtime image built via jlink didn't silently drop
      # a module needed at runtime (e.g. the #594-style Restlet HTTP connector
      # class of failure, or missing crypto providers for outbound HTTPS).
      - name: Package regression — validate (module completeness) (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          FIXTURE="modules/ikanos-cli/src/test/resources/native-regression/serve-http.ikanos.yaml"
          OUT=$(ikanos validate "$FIXTURE" 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -E "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError"; then
            echo "FAIL: jlink module-set regression on validate"
            exit 1
          fi

      - name: Package regression — validate (module completeness) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FIXTURE = "modules/ikanos-cli/src/test/resources/native-regression/serve-http.ikanos.yaml"
          $OUT = (& ikanos validate $FIXTURE 2>&1 | Out-String)
          Write-Host $OUT
          if ($OUT -match "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError") {
            Write-Error "FAIL: jlink module-set regression on validate"
            exit 1
          }

      - name: Package regression — serve REST + real HTTP GET returns 200 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          FIXTURE="modules/ikanos-cli/src/test/resources/native-regression/serve-rest-mock.ikanos.yaml"
          REST_PORT=9620
          ikanos serve "$FIXTURE" > serve-rest-mock.log 2>&1 &
          SERVE_PID=$!

          LISTENING=0
          for i in $(seq 1 20); do
            if (exec 3<>"/dev/tcp/127.0.0.1/$REST_PORT") 2>/dev/null; then
              exec 3>&- 3<&- 2>/dev/null || true
              LISTENING=1
              break
            fi
            kill -0 "$SERVE_PID" 2>/dev/null || break
            sleep 1
          done

          BODY=""
          STATUS=000
          if [ "$LISTENING" -eq 1 ]; then
            STATUS=$(curl -s -o resp-body.txt -w '%{http_code}' --max-time 15 \
              "http://127.0.0.1:$REST_PORT/greet" || echo 000)
            BODY="$(cat resp-body.txt 2>/dev/null || true)"
          fi

          kill "$SERVE_PID" 2>/dev/null || true

          echo "----- serve-rest-mock.log -----"; cat serve-rest-mock.log
          echo "----- HTTP status: $STATUS -----"
          echo "----- HTTP body:   $BODY -----"

          if grep -E "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError|No available server connector" serve-rest-mock.log; then
            echo "FAIL: jlink module-set regression on serve"
            exit 1
          fi
          if [ "$LISTENING" -ne 1 ]; then
            echo "FAIL: exposed REST port $REST_PORT never started listening — HTTP connector did not boot"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: GET /greet returned HTTP $STATUS, expected 200 — jlink image accepted the connection but did not serve the request"
            exit 1
          fi
          if ! printf '%s' "$BODY" | grep -q "Hello from native mock!"; then
            echo "FAIL: GET /greet body did not contain the expected greeting"
            exit 1
          fi
          echo "PASS: jlink package served a real HTTP GET with status 200 and the expected body"

      - name: Package regression — serve REST + real HTTP GET returns 200 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FIXTURE = "modules/ikanos-cli/src/test/resources/native-regression/serve-rest-mock.ikanos.yaml"
          $REST_PORT = 9620
          $proc = Start-Process -FilePath "ikanos" -ArgumentList "serve `"$FIXTURE`"" -RedirectStandardOutput serve-rest-mock.log -RedirectStandardError serve-rest-mock-err.log -PassThru -NoNewWindow

          $listening = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $conn = New-Object System.Net.Sockets.TcpClient
              $conn.Connect("127.0.0.1", $REST_PORT)
              $conn.Close()
              $listening = $true
              break
            } catch {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }
          }

          $status = 0
          $body = ""
          if ($listening) {
            try {
              # -TimeoutSec bounds the request: #594's symptom was a hang, so a
              # regression must fail fast rather than stall the runner.
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 "http://127.0.0.1:$REST_PORT/greet"
              $status = $response.StatusCode
              $body = $response.Content
            } catch {
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
              $body = $_.Exception.Message
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          Write-Host "----- serve-rest-mock.log -----"
          Get-Content serve-rest-mock.log -ErrorAction SilentlyContinue
          Get-Content serve-rest-mock-err.log -ErrorAction SilentlyContinue
          Write-Host "----- HTTP status: $status -----"
          Write-Host "----- HTTP body:   $body -----"

          $combined = (Get-Content serve-rest-mock.log, serve-rest-mock-err.log -ErrorAction SilentlyContinue | Out-String)
          if ($combined -match "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError|No available server connector") {
            Write-Error "FAIL: jlink module-set regression on serve"
            exit 1
          }
          if (-not $listening) {
            Write-Error "FAIL: exposed REST port $REST_PORT never started listening — HTTP connector did not boot"
            exit 1
          }
          if ($status -ne 200) {
            Write-Error "FAIL: GET /greet returned HTTP $status, expected 200 — jlink image accepted the connection but did not serve the request"
            exit 1
          }
          if ($body -notmatch "Hello from native mock!") {
            Write-Error "FAIL: GET /greet body did not contain the expected greeting"
            exit 1
          }
          Write-Host "PASS: jlink package served a real HTTP GET with status 200 and the expected body"
      # --- jlink module-set regression guard — outbound HTTPS (#718) -------
      # The module set above is derived via `jdeps --print-module-deps` from
      # serve-http.ikanos.yaml and serve-rest-mock.ikanos.yaml only — neither
      # performs an outbound TLS call. A jlink image missing jdk.crypto.ec /
      # jdk.crypto.cryptoki / jdk.security.jgss would pass every check above
      # while silently breaking any `consumes: http` capability over HTTPS.
      - name: Package regression — outbound HTTPS call succeeds (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="modules/ikanos-cli/src/test/resources/native-regression/serve-https-outbound.ikanos.yaml"
          HTTPS_PORT=9621
          ikanos serve "$FIXTURE" > serve-https-outbound.log 2>&1 &
          SERVE_PID=$!

          LISTENING=0
          for i in $(seq 1 20); do
            if (exec 3<>"/dev/tcp/127.0.0.1/$HTTPS_PORT") 2>/dev/null; then
              exec 3>&- 3<&- 2>/dev/null || true
              LISTENING=1
              break
            fi
            kill -0 "$SERVE_PID" 2>/dev/null || break
            sleep 1
          done

          STATUS=000
          if [ "$LISTENING" -eq 1 ]; then
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              "http://127.0.0.1:$HTTPS_PORT/status" || echo 000)
          fi

          kill "$SERVE_PID" 2>/dev/null || true

          echo "----- serve-https-outbound.log -----"; cat serve-https-outbound.log
          echo "----- HTTP status: $STATUS -----"

          if grep -E "SSLHandshakeException|NoSuchAlgorithmException|ProviderException|NoClassDefFoundError|ClassNotFoundException" serve-https-outbound.log; then
            echo "FAIL: jlink module set is missing a crypto/outbound-HTTPS module"
            exit 1
          fi
          if [ "$LISTENING" -ne 1 ]; then
            echo "FAIL: exposed REST port $HTTPS_PORT never started listening"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: outbound HTTPS call returned status $STATUS, expected 200 — jlink image likely missing a TLS/crypto module (jdk.crypto.ec, jdk.crypto.cryptoki, jdk.security.jgss)"
            exit 1
          fi
          echo "PASS: jlink package completed a real outbound HTTPS call"

      - name: Package regression — outbound HTTPS call succeeds (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FIXTURE = "modules/ikanos-cli/src/test/resources/native-regression/serve-https-outbound.ikanos.yaml"
          $HTTPS_PORT = 9621
          $proc = Start-Process -FilePath "ikanos" -ArgumentList "serve `"$FIXTURE`"" -RedirectStandardOutput serve-https-outbound.log -RedirectStandardError serve-https-outbound-err.log -PassThru -NoNewWindow

          $listening = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $conn = New-Object System.Net.Sockets.TcpClient
              $conn.Connect("127.0.0.1", $HTTPS_PORT)
              $conn.Close()
              $listening = $true
              break
            } catch {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }
          }

          $status = 0
          if ($listening) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 "http://127.0.0.1:$HTTPS_PORT/status"
              $status = $response.StatusCode
            } catch {
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          Write-Host "----- serve-https-outbound.log -----"
          Get-Content serve-https-outbound.log -ErrorAction SilentlyContinue
          Get-Content serve-https-outbound-err.log -ErrorAction SilentlyContinue
          Write-Host "----- HTTP status: $status -----"

          $combined = (Get-Content serve-https-outbound.log, serve-https-outbound-err.log -ErrorAction SilentlyContinue | Out-String)
          if ($combined -match "SSLHandshakeException|NoSuchAlgorithmException|ProviderException|NoClassDefFoundError|ClassNotFoundException") {
            Write-Error "FAIL: jlink module set is missing a crypto/outbound-HTTPS module"
            exit 1
          }
          if (-not $listening) {
            Write-Error "FAIL: exposed REST port $HTTPS_PORT never started listening"
            exit 1
          }
          if ($status -ne 200) {
            Write-Error "FAIL: outbound HTTPS call returned status $status, expected 200 — jlink image likely missing a TLS/crypto module (jdk.crypto.ec, jdk.crypto.cryptoki, jdk.security.jgss)"
            exit 1
          }
          Write-Host "PASS: jlink package completed a real outbound HTTPS call"