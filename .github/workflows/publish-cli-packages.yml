name: Publish CLI Packages

# Builds the Ikanos CLI as ikanos.jar plus a custom jlink JRE, one archive per OS with a SHA-256
# checksum, and installs it with docs/install.sh / install.ps1. JReleaser makes the archives
# (jreleaser.yml). On a v* tag, create-release.yml calls it through workflow_call and JReleaser
# publishes the archives on the release.

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'modules/ikanos-*/pom.xml'
      - 'jreleaser.yml'
      - 'docs/install.sh'
      - 'docs/install.ps1'
      - '.github/workflows/publish-cli-packages.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  build-package:
    name: Build package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # jdk: the variable jreleaser.yml reads this runner's JDK from. assembler: the jreleaser.yml
          # assembler that builds this OS's package, and the folder of out/jreleaser/assemble it lands in.
          # macOS Apple Silicon (ARM64)
          - os: macos-latest  # macos-14+ uses Mx runners
            artifact_name: ikanos-cli-macos-arm64.tar.gz
            jdk: IKANOS_JDK_MACOS_ARM64
            assembler: ikanos-cli

          # Linux AMD64
          - os: ubuntu-latest
            artifact_name: ikanos-cli-linux-amd64.tar.gz
            jdk: IKANOS_JDK_LINUX_X64
            assembler: ikanos-cli

          # Linux ARM64
          - os: ubuntu-24.04-arm
            artifact_name: ikanos-cli-linux-arm64.tar.gz
            jdk: IKANOS_JDK_LINUX_ARM64
            assembler: ikanos-cli

          # Windows AMD64: its own assembler, for the two Windows-only modules (jreleaser.yml).
          - os: windows-latest
            artifact_name: ikanos-cli-windows-amd64.zip
            jdk: IKANOS_JDK_WINDOWS_X64
            assembler: ikanos-cli-windows

    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          # The latest 25.x build, not the runner's cached one: the JDK we ship gets its security fixes.
          check-latest: true
          distribution: 'temurin'

      - name: Build shaded jar with Maven
        run: |
          mvn -B clean package -pl modules/ikanos-cli -am -DskipTests
          # Without -q, so a failure says why; the version goes to a file, not into the log.
          mvn -B help:evaluate -Dexpression=project.version -Doutput=target/version.txt
          {
            echo "JRELEASER_PROJECT_VERSION=$(cat target/version.txt)"
            echo "${{ matrix.jdk }}=$JAVA_HOME"
          } >> "$GITHUB_ENV"

      # jreleaser.yml repeats ikanos-cli's settings in ikanos-cli-windows (JReleaser reads no YAML
      # anchors): the Windows runtime must keep the same modules, plus its two Windows-only ones.
      - name: The Windows assembler keeps the shared settings
        if: matrix.os == 'ubuntu-latest'
        run: |
          ruby -ryaml -e '
            jlink = YAML.load_file("jreleaser.yml")["assemble"]["jlink"]
            main, windows = jlink["ikanos-cli"], jlink["ikanos-cli-windows"]
            extra = %w[jdk.accessibility jdk.crypto.mscapi]
            problems = []
            problems << "modules differ" unless windows["additionalModuleNames"].sort == (main["additionalModuleNames"] + extra).sort
            %w[stereotype executable imageName mainJar jdeps args java fileSets].each do |key|
              problems << "#{key} differs" unless main[key] == windows[key]
            end
            abort("FAIL: ikanos-cli-windows drifted from ikanos-cli: #{problems.join(", ")}") unless problems.empty?
            puts "ikanos-cli-windows = ikanos-cli + #{extra.join(", ")}"'

      # JReleaser builds the jlink runtime and packs it with ikanos.jar (jreleaser.yml): jdeps
      # picks the JDK modules, and jreleaser.yml adds the ones --bind-services used to add. Each
      # runner builds its own OS's package with its own JDK.
      - name: Package with JReleaser
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff # v2
        with:
          version: 1.26.0
          arguments: assemble --select-current-platform
          # jlink must use the JDK set up above, not the action's own.
          setup-java: false

      # The installers run bin/java -jar jars/ikanos.jar from the package's one folder: fail
      # fast if that layout ever drifts, before the test job installs it.
      - name: Smoke test the package — extract + run --version
        run: |
          set -euo pipefail
          PACKAGE="out/jreleaser/assemble/${{ matrix.assembler }}/jlink/${{ matrix.artifact_name }}"
          TESTDIR="$RUNNER_TEMP/ikanos-package-smoketest"
          mkdir -p "$TESTDIR"
          case "$PACKAGE" in
            *.zip) pwsh -NoProfile -Command "Expand-Archive -Path '$PACKAGE' -DestinationPath '$TESTDIR'"; JAVA=java.exe ;;
            *) tar xzf "$PACKAGE" -C "$TESTDIR"; JAVA=java ;;
          esac
          ROOT="$TESTDIR/${{ matrix.artifact_name }}"
          ROOT="${ROOT%.tar.gz}"; ROOT="${ROOT%.zip}"
          ls "$ROOT"
          test -f "$ROOT/bin/$JAVA" || { echo "FAIL: bin/$JAVA missing"; exit 1; }
          test -f "$ROOT/jars/ikanos.jar" || { echo "FAIL: jars/ikanos.jar missing"; exit 1; }
          "$ROOT/bin/$JAVA" -jar "$ROOT/jars/ikanos.jar" --version
          # The Windows certificate store, for -Djavax.net.ssl.trustStoreType=Windows-ROOT behind a
          # TLS-inspecting proxy: jdk.crypto.mscapi must be in the runtime, and the store must open.
          if [ "$RUNNER_OS" = Windows ]; then
            cat > "$RUNNER_TEMP/OpenStore.java" <<'JAVA'
          public class OpenStore {
              public static void main(String[] args) throws Exception {
                  java.security.KeyStore store = java.security.KeyStore.getInstance(args[0]);
                  store.load(null, null);
                  System.out.println(args[0] + ": " + store.size() + " certificates, from " + store.getProvider().getName());
              }
          }
          JAVA
            "$ROOT/bin/$JAVA" "$RUNNER_TEMP/OpenStore.java" Windows-ROOT | tee "$RUNNER_TEMP/store.txt"
            grep -q "from SunMSCAPI" "$RUNNER_TEMP/store.txt" || { echo "FAIL: Windows-ROOT doesn't open through SunMSCAPI"; exit 1; }
          fi

      # The hash alone, as JReleaser writes it on the release (checksum.individual in jreleaser.yml).
      - name: Generate checksum
        working-directory: out/jreleaser/assemble/${{ matrix.assembler }}/jlink
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
          $SUM "${{ matrix.artifact_name }}" | awk '{ printf "%s", $1 }' > "${{ matrix.artifact_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            out/jreleaser/assemble/${{ matrix.assembler }}/jlink/${{ matrix.artifact_name }}
            out/jreleaser/assemble/${{ matrix.assembler }}/jlink/${{ matrix.artifact_name }}.sha256

      - name: Keep JReleaser's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-log-${{ matrix.jdk }}
          path: out/jreleaser/trace.log
          retention-days: 7

  test-package:
    name: Test package on ${{ matrix.os }}
    needs: build-package
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: ikanos-cli-macos-arm64.tar.gz
          - os: ubuntu-latest
            artifact_name: ikanos-cli-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            artifact_name: ikanos-cli-linux-arm64.tar.gz
          - os: windows-latest
            artifact_name: ikanos-cli-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: ./pkg

      # The .sha256 holds the hash alone, as on the release.
      - name: Verify checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ./pkg
        run: |
          expected=$(cat "${{ matrix.artifact_name }}.sha256")
          actual=$(shasum -a 256 "${{ matrix.artifact_name }}" | awk '{ print $1 }')
          [ "$actual" = "$expected" ] || { echo "Checksum mismatch: expected $expected, got $actual"; exit 1; }

      - name: Verify checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = (Get-Content "./pkg/${{ matrix.artifact_name }}.sha256" -Raw).Split(' ')[0].Trim().ToLower()
          $actual = (Get-FileHash "./pkg/${{ matrix.artifact_name }}" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "Checksum mismatch: expected $expected, got $actual"
          }

      - name: Install via install.sh (real script, mock release endpoint) (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8931 --directory ./pkg --bind 127.0.0.1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:8931/${{ matrix.artifact_name }}.sha256" >/dev/null 2>&1 && break
            sleep 0.5
          done

          # A space in the install root, so quoting is exercised for real.
          IKANOS_HOME="$RUNNER_TEMP/ikanos home" \
          IKANOS_NO_MODIFY_RC=1 \
          IKANOS_VERSION="v0.0.0-local-ci" \
          IKANOS_BASE_URL="http://127.0.0.1:8931" \
            sh docs/install.sh
          # Only bin goes on PATH, like the rc file line. IKANOS_HOME is not
          # exported, so the next steps run the wrapper as a new shell would
          # and check that it remembers its custom install root (#805).
          echo "$RUNNER_TEMP/ikanos home/bin" >> "$GITHUB_PATH"

      - name: Install via install.ps1 (real script, mock release endpoint) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgDir = Join-Path (Get-Location) "pkg"
          $proc = Start-Process -FilePath "python" -ArgumentList "-m","http.server","8931","--directory","$pkgDir","--bind","127.0.0.1" -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 20; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8931/${{ matrix.artifact_name }}.sha256" | Out-Null
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }

            # A space and a non-ASCII character in the install root: cmd.exe
            # reads ikanos.cmd in the OEM code page, so this catches a wrapper
            # that would garble such a path (like an accented user name).
            $env:IKANOS_HOME = "$env:RUNNER_TEMP\ikanos h$([char]0x00F4)me"
            $env:IKANOS_NO_MODIFY_PATH = "1"
            $env:IKANOS_VERSION = "v0.0.0-local-ci"
            $env:IKANOS_BASE_URL = "http://127.0.0.1:8931"
            & .\docs\install.ps1

            # Only bin goes on PATH. IKANOS_HOME is not exported, so the next
            # steps check that ikanos.cmd finds its custom install root (#805).
            Add-Content -Path $env:GITHUB_PATH -Value "$env:IKANOS_HOME\bin"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: CLI is on PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          command -v ikanos
          ikanos --version

      - name: CLI is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command ikanos
          ikanos --version

      - name: Test create + validate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf "test\nhttps://api.com\n8080\n" | ikanos create capability
          ikanos v test.ikanos.yaml

      - name: Test create + validate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "test`nhttps://api.com`n8080`n" | ikanos create capability
          ikanos v test.ikanos.yaml

      # --- jlink module-set regression guard --------------------------------
      # Ensures the custom runtime image built via jlink didn't silently drop
      # a module needed at runtime (e.g. the #594-style Restlet HTTP connector
      # class of failure, or missing crypto providers for outbound HTTPS).
      - name: Package regression — validate (module completeness) (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          FIXTURE="modules/ikanos-cli/src/test/resources/package-regression/serve-http.ikanos.yaml"
          OUT=$(ikanos validate "$FIXTURE" 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -E "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError"; then
            echo "FAIL: jlink module-set regression on validate"
            exit 1
          fi

      - name: Package regression — validate (module completeness) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FIXTURE = "modules/ikanos-cli/src/test/resources/package-regression/serve-http.ikanos.yaml"
          $OUT = (& ikanos validate $FIXTURE 2>&1 | Out-String)
          Write-Host $OUT
          if ($OUT -match "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError") {
            Write-Error "FAIL: jlink module-set regression on validate"
            exit 1
          }

      - name: Package regression — serve REST + real HTTP GET returns 200 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          FIXTURE="modules/ikanos-cli/src/test/resources/package-regression/serve-rest-mock.ikanos.yaml"
          REST_PORT=9620
          ikanos serve "$FIXTURE" > serve-rest-mock.log 2>&1 &
          SERVE_PID=$!

          LISTENING=0
          for i in $(seq 1 20); do
            if (exec 3<>"/dev/tcp/127.0.0.1/$REST_PORT") 2>/dev/null; then
              exec 3>&- 3<&- 2>/dev/null || true
              LISTENING=1
              break
            fi
            kill -0 "$SERVE_PID" 2>/dev/null || break
            sleep 1
          done

          BODY=""
          STATUS=000
          if [ "$LISTENING" -eq 1 ]; then
            STATUS=$(curl -s -o resp-body.txt -w '%{http_code}' --max-time 15 \
              "http://127.0.0.1:$REST_PORT/greet" || echo 000)
            BODY="$(cat resp-body.txt 2>/dev/null || true)"
          fi

          kill "$SERVE_PID" 2>/dev/null || true

          echo "----- serve-rest-mock.log -----"; cat serve-rest-mock.log
          echo "----- HTTP status: $STATUS -----"
          echo "----- HTTP body:   $BODY -----"

          if grep -E "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError|No available server connector" serve-rest-mock.log; then
            echo "FAIL: jlink module-set regression on serve"
            exit 1
          fi
          if [ "$LISTENING" -ne 1 ]; then
            echo "FAIL: exposed REST port $REST_PORT never started listening — HTTP connector did not boot"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: GET /greet returned HTTP $STATUS, expected 200 — jlink image accepted the connection but did not serve the request"
            exit 1
          fi
          if ! printf '%s' "$BODY" | grep -q "Hello from the package mock!"; then
            echo "FAIL: GET /greet body did not contain the expected greeting"
            exit 1
          fi
          echo "PASS: jlink package served a real HTTP GET with status 200 and the expected body"

      - name: Package regression — serve REST + real HTTP GET returns 200 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FIXTURE = "modules/ikanos-cli/src/test/resources/package-regression/serve-rest-mock.ikanos.yaml"
          $REST_PORT = 9620
          $proc = Start-Process -FilePath "ikanos" -ArgumentList "serve `"$FIXTURE`"" -RedirectStandardOutput serve-rest-mock.log -RedirectStandardError serve-rest-mock-err.log -PassThru -NoNewWindow

          $listening = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $conn = New-Object System.Net.Sockets.TcpClient
              $conn.Connect("127.0.0.1", $REST_PORT)
              $conn.Close()
              $listening = $true
              break
            } catch {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }
          }

          $status = 0
          $body = ""
          if ($listening) {
            try {
              # -TimeoutSec bounds the request: #594's symptom was a hang, so a
              # regression must fail fast rather than stall the runner.
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 "http://127.0.0.1:$REST_PORT/greet"
              $status = $response.StatusCode
              $body = $response.Content
            } catch {
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
              $body = $_.Exception.Message
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          Write-Host "----- serve-rest-mock.log -----"
          Get-Content serve-rest-mock.log -ErrorAction SilentlyContinue
          Get-Content serve-rest-mock-err.log -ErrorAction SilentlyContinue
          Write-Host "----- HTTP status: $status -----"
          Write-Host "----- HTTP body:   $body -----"

          $combined = (Get-Content serve-rest-mock.log, serve-rest-mock-err.log -ErrorAction SilentlyContinue | Out-String)
          if ($combined -match "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError|No available server connector") {
            Write-Error "FAIL: jlink module-set regression on serve"
            exit 1
          }
          if (-not $listening) {
            Write-Error "FAIL: exposed REST port $REST_PORT never started listening — HTTP connector did not boot"
            exit 1
          }
          if ($status -ne 200) {
            Write-Error "FAIL: GET /greet returned HTTP $status, expected 200 — jlink image accepted the connection but did not serve the request"
            exit 1
          }
          if ($body -notmatch "Hello from the package mock!") {
            Write-Error "FAIL: GET /greet body did not contain the expected greeting"
            exit 1
          }
          Write-Host "PASS: jlink package served a real HTTP GET with status 200 and the expected body"
      # --- jlink module-set regression guard — outbound HTTPS (#718) -------
      # The module set above is derived via `jdeps --print-module-deps` from
      # serve-http.ikanos.yaml and serve-rest-mock.ikanos.yaml only — neither
      # performs an outbound TLS call. A jlink image missing jdk.crypto.ec /
      # jdk.crypto.cryptoki / jdk.security.jgss would pass every check above
      # while silently breaking any `consumes: http` capability over HTTPS.
      # Real HTTP requests to every control port route, from the installed package. Moved from the
      # former native binary workflow (#608, #914), so the control port keeps its package-level guard.
      # It serves its own copy of the fixture on other ports, so it never talks to a server left over
      # from a previous step.
      - name: Package regression — control port answers every route over real HTTP (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          FIXTURE="$RUNNER_TEMP/control-port.ikanos.yaml"
          sed -e 's/port: 9610$/port: 9710/' -e 's/port: 9612$/port: 9712/' -e 's/port: 9619$/port: 9719/' \
            modules/ikanos-cli/src/test/resources/package-regression/serve-http.ikanos.yaml > "$FIXTURE"
          grep -q "port: 9719" "$FIXTURE" || { echo "FAIL: could not move the fixture's control port"; exit 1; }
          BASE="http://127.0.0.1:9719"
          ikanos serve "$FIXTURE" > serve-control.log 2>&1 &
          SERVE_PID=$!

          fail() {
            echo "FAIL: $*"
            kill "$SERVE_PID" 2>/dev/null || true
            echo "----- serve-control.log -----"; cat serve-control.log
            exit 1
          }
          # get PATH: sets STATUS and BODY. curl is the external HTTP client.
          get() {
            : > body.txt
            STATUS=$(curl -s -o body.txt -w '%{http_code}' --max-time 5 "$BASE$1" || true)
            BODY=$(cat body.txt)
          }

          STATUS=000
          for _ in $(seq 1 30); do
            get /health/live
            [ "$STATUS" = "200" ] && break
            kill -0 "$SERVE_PID" 2>/dev/null || fail "serve exited before the control port answered"
            sleep 1
          done
          [ "$STATUS" = "200" ] || fail "GET /health/live never answered 200 (last: '$STATUS')"
          [ "$BODY" = '{"status":"UP"}' ] || fail "unexpected /health/live body: $BODY"

          get /health/ready
          [ "$STATUS" = "200" ] || fail "GET /health/ready returned $STATUS: $BODY"
          case "$BODY" in *'"status":"UP"'*) ;; *) fail "unexpected /health/ready body: $BODY" ;; esac

          get /status
          [ "$STATUS" = "200" ] || fail "GET /status returned $STATUS: $BODY"
          case "$BODY" in *'"engine":{"version":'*) ;; *) fail "/status has no engine version: $BODY" ;; esac
          case "$BODY" in
            *'"otel":{"status":"active"}'*) OTEL=active ;;
            *'"otel":{"status":"inactive"}'*) OTEL=inactive ;;
            *) fail "/status has no OpenTelemetry status: $BODY" ;;
          esac
          echo "OpenTelemetry in the package: $OTEL"

          # /metrics and /traces must agree with what /status reports.
          get /metrics; METRICS_STATUS=$STATUS; METRICS_BODY=$BODY
          get /traces; TRACES_STATUS=$STATUS; TRACES_BODY=$BODY
          if [ "$OTEL" = "active" ]; then
            [ "$METRICS_STATUS" = "200" ] || fail "GET /metrics returned $METRICS_STATUS with OpenTelemetry active: $METRICS_BODY"
            case "$METRICS_BODY" in *ikanos_capability_active*) ;; *) fail "/metrics lacks ikanos_capability_active: $METRICS_BODY" ;; esac
            [ "$TRACES_STATUS" = "200" ] || fail "GET /traces returned $TRACES_STATUS with OpenTelemetry active: $TRACES_BODY"
            case "$TRACES_BODY" in *'"traces":'*) ;; *) fail "unexpected /traces body: $TRACES_BODY" ;; esac
          else
            [ "$METRICS_STATUS" = "503" ] || fail "GET /metrics returned $METRICS_STATUS with OpenTelemetry inactive, expected 503"
            [ "$TRACES_STATUS" = "503" ] || fail "GET /traces returned $TRACES_STATUS with OpenTelemetry inactive, expected 503"
          fi

          kill "$SERVE_PID" 2>/dev/null || true
          echo "----- serve-control.log -----"; cat serve-control.log
          if grep -E "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError|No available server connector" serve-control.log; then
            echo "FAIL: jlink module-set regression on the control port"
            exit 1
          fi
          echo "PASS: the control port answered every route over real HTTP."

      - name: Package regression — outbound HTTPS call succeeds (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="modules/ikanos-cli/src/test/resources/package-regression/serve-https-outbound.ikanos.yaml"
          HTTPS_PORT=9621
          ikanos serve "$FIXTURE" > serve-https-outbound.log 2>&1 &
          SERVE_PID=$!

          LISTENING=0
          for i in $(seq 1 20); do
            if (exec 3<>"/dev/tcp/127.0.0.1/$HTTPS_PORT") 2>/dev/null; then
              exec 3>&- 3<&- 2>/dev/null || true
              LISTENING=1
              break
            fi
            kill -0 "$SERVE_PID" 2>/dev/null || break
            sleep 1
          done

          STATUS=000
          if [ "$LISTENING" -eq 1 ]; then
            STATUS=$(curl -s -o serve-https-outbound.body -w '%{http_code}' --max-time 15 \
              "http://127.0.0.1:$HTTPS_PORT/status" || echo 000)
          fi

          kill "$SERVE_PID" 2>/dev/null || true

          echo "----- serve-https-outbound.log -----"; cat serve-https-outbound.log
          echo "----- HTTP status: $STATUS -----"
          echo "----- response body -----"; head -c 500 serve-https-outbound.body 2>/dev/null || true; echo

          if grep -E "SSLHandshakeException|NoSuchAlgorithmException|ProviderException|NoClassDefFoundError|ClassNotFoundException" serve-https-outbound.log; then
            echo "FAIL: jlink module set is missing a crypto/outbound-HTTPS module"
            exit 1
          fi
          if [ "$LISTENING" -ne 1 ]; then
            echo "FAIL: exposed REST port $HTTPS_PORT never started listening"
            exit 1
          fi
          # 403/429 is GitHub's unauthenticated rate limit (60 requests/hour per IP, often
          # exhausted on shared macOS runners). Getting it back still proves the TLS
          # handshake succeeded, which is all this step guards.
          if [ "$STATUS" = "403" ] || [ "$STATUS" = "429" ]; then
            echo "PASS: TLS handshake succeeded; api.github.com answered $STATUS (rate limit), not a jlink issue"
            exit 0
          fi
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: outbound HTTPS call returned status $STATUS, expected 200 — no TLS/crypto exception in the log, so this is the backend's response (rate limit, outage), not a missing jlink module"
            exit 1
          fi
          echo "PASS: jlink package completed a real outbound HTTPS call"

      - name: Package regression — outbound HTTPS call succeeds (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FIXTURE = "modules/ikanos-cli/src/test/resources/package-regression/serve-https-outbound.ikanos.yaml"
          $HTTPS_PORT = 9621
          $proc = Start-Process -FilePath "ikanos" -ArgumentList "serve `"$FIXTURE`"" -RedirectStandardOutput serve-https-outbound.log -RedirectStandardError serve-https-outbound-err.log -PassThru -NoNewWindow

          $listening = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $conn = New-Object System.Net.Sockets.TcpClient
              $conn.Connect("127.0.0.1", $HTTPS_PORT)
              $conn.Close()
              $listening = $true
              break
            } catch {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }
          }

          $status = 0
          $body = ""
          if ($listening) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 "http://127.0.0.1:$HTTPS_PORT/status"
              $status = $response.StatusCode
              $body = $response.Content
            } catch {
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
              if ($_.ErrorDetails) { $body = $_.ErrorDetails.Message }
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          Write-Host "----- serve-https-outbound.log -----"
          Get-Content serve-https-outbound.log -ErrorAction SilentlyContinue
          Get-Content serve-https-outbound-err.log -ErrorAction SilentlyContinue
          Write-Host "----- HTTP status: $status -----"
          Write-Host "----- response body -----"
          if ($body) { Write-Host ($body.Substring(0, [Math]::Min(500, $body.Length))) }

          $combined = (Get-Content serve-https-outbound.log, serve-https-outbound-err.log -ErrorAction SilentlyContinue | Out-String)
          if ($combined -match "SSLHandshakeException|NoSuchAlgorithmException|ProviderException|NoClassDefFoundError|ClassNotFoundException") {
            Write-Error "FAIL: jlink module set is missing a crypto/outbound-HTTPS module"
            exit 1
          }
          if (-not $listening) {
            Write-Error "FAIL: exposed REST port $HTTPS_PORT never started listening"
            exit 1
          }
          # 403/429 is GitHub's unauthenticated rate limit; the TLS handshake still succeeded.
          if ($status -eq 403 -or $status -eq 429) {
            Write-Host "PASS: TLS handshake succeeded; api.github.com answered $status (rate limit), not a jlink issue"
            exit 0
          }
          if ($status -ne 200) {
            Write-Error "FAIL: outbound HTTPS call returned status $status, expected 200 — no TLS/crypto exception in the log, so this is the backend's response (rate limit, outage), not a missing jlink module"
            exit 1
          }
          Write-Host "PASS: jlink package completed a real outbound HTTPS call"