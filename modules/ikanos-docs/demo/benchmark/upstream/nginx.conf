# The upstream API: static JSON, so that it never limits the benchmark.
server {
    listen 80;
    default_type application/json;
    access_log off;
    root /data;
    location = /ships { try_files /ships.json =404; }
    location = /fleet { try_files /fleet.json =404; }
    location ~ ^/ships/(?<imo>[A-Za-z0-9-]+)$ { try_files /ships/$imo.json =404; }
}
