ikanos: "1.0.0-beta10"
info:
  display: Package Regression — HTTP Connector
  description: >
    Minimal REST capability used by the package regression guards in
    publish-cli-packages.yml: `validate` checks it, and the control port guard
    serves it and sends real HTTP requests to every control route. Serving it
    instantiates the Restlet HTTP server connector (new Server(Protocol.HTTP,
    ...)). Self-contained: no external file or skill location dependency, so
    `ikanos serve` can run it unattended in CI.
  tags:
  - test
  - package-regression
  created: '2026-06-17'
  modified: '2026-06-17'
capability:
  exposes:
  - type: rest
    address: localhost
    port: 9610
    namespace: ping-rest
    resources:
      ping:
        path: /ping
        display: Ping
        description: Trivial endpoint that exists only to wire up the HTTP connector
        operations:
          get-ping:
            method: GET
            display: Get Ping
            call: ping-backend.get
  - type: mcp
    address: localhost
    port: 9612
    namespace: regression-skills
    description: Package regression skills-only MCP server
    skills:
      networknt-probe:
        description: >
          Purely descriptive skill whose description, compatibility and
          allowed-tools fields carry the schema maxLength constraints, forcing
          the networknt MaxLengthValidator to be instantiated during validate.
        license: Apache-2.0
        compatibility: Any runtime — descriptive only, exercises maxLength validation.
        allowed-tools: none
  - type: control
    address: localhost
    port: 9619
    management:
      health: true
      info: true
  consumes:
  - type: http
    namespace: ping-backend
    baseUri: http://localhost:9611/v1
    resources:
      ping:
        path: ping
        operations:
          get:
            method: GET
            display: Get Ping
