ikanos: "1.0.0-beta10"
info:
  display: Package Regression — Minimal REST Mock
  description: >
    The smallest possible capability that exposes a single REST endpoint and
    nothing else: one `type: rest` adapter, one mock resource returning a static
    value, NO consumes, NO control, NO backend. The package regression guard in
    publish-cli-packages.yml serves it from the installed jlink package and sends
    a real HTTP GET, so a package that binds the port but cannot answer (a
    missing JDK module, for instance) fails CI. Self-contained: `ikanos serve`
    can run it unattended.
  tags:
  - test
  - package-regression
  created: '2026-06-24'
  modified: '2026-06-24'
capability:
  exposes:
  - type: rest
    address: localhost
    port: 9620
    namespace: mock-rest
    resources:
      greet:
        path: /greet
        display: Greet
        description: Mock endpoint returning a static greeting, no backend.
        operations:
          get-greeting:
            method: GET
            display: Get Greeting
            description: Returns a fixed greeting without any upstream call.
            outputParameters:
              message:
                type: string
                value: "Hello from the package mock!"
