---
# MCP files extension example (experimental, draft `io.modelcontextprotocol/files`).
#
# The `files` block on the MCP adapter opts into the extension: `server/discover` advertises it,
# and a `tools/call` that declares `download` in its client capabilities gets large files as
# download targets in the result's `_meta`, with a text summary in `content`, instead of inline
# base64. Without `files`, or for a client that does not declare `download`, results are unchanged.
#
#   - get-photo: a binary result above `inlineThreshold` is served once, for `ttl`, from a link
#     on this adapter (`credentials: include`, authenticated like the MCP endpoint).
#   - export-orders: the consumed API already returns a presigned URL; `download` names the
#     output properties that describe the file, returned with `credentials: omit`.
#   - import-report: the `documents.import-report` flow takes a file (`type: file`). Over MCP, the
#     tool takes the draft's file object marked `x-mcp-file`, with the bytes inline in `data` (up
#     to `uploads.maxInlineBytes` per call), and is listed only to clients that declare the
#     extension. Over REST, the operation takes a `multipart/form-data` body. Either way, the flow
#     sends the file on as a `multipartForm` part, from `{{report.data}}` in base64.
ikanos: "1.0.0-beta11"

info:
  display: "Photo library and exports (MCP files example)"
  description: >
    Return large photos and order exports to MCP clients as download targets rather than inline
    bytes, through the experimental MCP files extension.
  tags:
    - files
    - binary
    - example

capability:
  consumes:
    - type: "http"
      namespace: "photo-library"
      description: "Upstream photo library API serving original-resolution image bytes."
      baseUri: "https://photos.example.org"
      resources:
        photos:
          description: "Photo binary resource."
          path: "/photos/{{id}}/binary"
          operations:
            download-photo:
              method: "GET"
              description: "Download the original-resolution bytes of a photo by id."
              outputRawFormat: "binary"
              outputMediaType: "image/jpeg"
    - type: "http"
      namespace: "records"
      description: "Upstream records API that stores lab reports."
      baseUri: "https://records.example.org"
      resources:
        reports:
          description: "Lab report resource."
          path: "/reports"
          operations:
            upload-report:
              method: "POST"
              description: "Store a lab report, sent as multipart/form-data."
              body:
                type: "multipartForm"
                data:
                  - name: "label"
                    value: "{{label}}"
                  - name: "file"
                    value: "{{report.data}}"
                    encoding: "base64"
                    filename: "{{report.name}}"
                    contentType: "{{report.mimeType}}"
    - type: "http"
      namespace: "exports"
      description: "Upstream export API that writes files to object storage."
      baseUri: "https://exports.example.org"
      resources:
        order-exports:
          description: "Order export resource."
          path: "/exports/orders/{{quarter}}"
          operations:
            export-orders:
              method: "POST"
              description: "Export the orders of a quarter as CSV and return a presigned URL."

  aggregates:
    - display: "Documents"
      namespace: "documents"
      flows:
        import-report:
          description: "Import a lab report into the records system."
          semantics:
            idempotent: false
          inputParameters:
            report:
              type: "file"
              accept:
                - "application/pdf"
                - "text/csv"
              maxSize: "50MiB"
              required: true
              description: "The report to import."
            label:
              type: "string"
              description: "A label for the report."
          call: "records.upload-report"

  exposes:
    - type: "rest"
      address: "0.0.0.0"
      port: 8080
      namespace: "documents-api"
      maxBinarySize: "50MiB"
      resources:
        reports:
          description: "Lab reports."
          path: "/reports"
          operations:
            import-report:
              method: "POST"
              description: "Import a lab report, sent as multipart/form-data."
              ref: "documents.import-report"
    - type: "mcp"
      address: "0.0.0.0"
      port: 8765
      namespace: "photos-mcp"
      description: "Photo library MCP server that returns large files as download targets."
      maxBinarySize: "25MiB"
      files:
        downloads:
          inlineThreshold: "1MiB"
          ttl: "PT5M"
        uploads:
          maxInlineBytes: "1MiB"
      tools:
        get-photo:
          description: "Download the original-resolution bytes of a photo by id."
          hints:
            readOnly: true
          inputParameters:
            id:
              type: "string"
              required: true
              description: "Photo identifier."
          call: "photo-library.download-photo"
          with:
            id: "{{id}}"
        export-orders:
          description: "Export the orders of a quarter as a CSV file."
          inputParameters:
            quarter:
              type: "string"
              required: true
              description: "Quarter to export, such as 2026-Q3."
          call: "exports.export-orders"
          with:
            quarter: "{{quarter}}"
          outputParameters:
            - type: "object"
              mapping: "$"
              properties:
                url:
                  type: "string"
                  mapping: "$.signedUrl"
                size:
                  type: "number"
                  mapping: "$.contentLength"
                file-name:
                  type: "string"
                  mapping: "$.fileName"
                expires-at:
                  type: "string"
                  mapping: "$.expiresAt"
          download:
            url: "url"
            size: "size"
            name: "file-name"
            expiresAt: "expires-at"
        import-report:
          description: "Import a lab report into the records system."
          ref: "documents.import-report"
