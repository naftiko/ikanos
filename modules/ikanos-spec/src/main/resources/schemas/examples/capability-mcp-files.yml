---
# MCP files extension example (experimental, draft `io.modelcontextprotocol/files`).
#
# The `files` block on the MCP adapter opts into the extension: `server/discover` advertises it,
# and a `tools/call` that declares `download` in its client capabilities gets large files as
# download targets in the result's `_meta`, with a text summary in `content`, instead of inline
# base64. Without `files`, or for a client that does not declare `download`, results are unchanged.
#
#   - get-photo: a binary result above `inlineThreshold` is served once, for `ttl`, from a link
#     on this adapter (`credentials: include`, authenticated like the MCP endpoint).
#   - export-orders: the consumed API already returns a presigned URL; `download` names the
#     output properties that describe the file, returned with `credentials: omit`.
#   - import-report: the `documents.import-report` flow takes a file (`type: file`). Over MCP, the
#     tool takes the draft's file object marked `x-mcp-file`, with the bytes inline in `data` (up
#     to `uploads.maxInlineBytes` per call), and is listed only to clients that declare the
#     extension. Over REST, the operation takes a `multipart/form-data` body. Either way, the flow
#     sends the file on as a `multipartForm` part, from `{{report.data}}` in base64.
#     The adapter also hosts uploads (`uploads.hosted: true`), so a report larger than
#     `maxInlineBytes` can be sent out of band: a client that declares `upload` calls the tool
#     with the file's metadata and no `data`, gets an `upload_required` result whose target is a
#     path on this adapter (`/files/<token>` under the MCP address, `credentials: include`),
#     `PUT`s the bytes there with its MCP credential, and retries the call. Ikanos keeps the bytes
#     (within `quota`, the target open for `ttl`), checks their size, type and digest on the
#     retry, runs the flow with them as if they had been sent inline, then deletes them.
#   - import-scan: the `documents.import-scan` flow declares `upload`: its file is stored in an
#     object store that issues presigned URLs, so large scans never pass through Ikanos. A client
#     that declares `upload` calls the tool with the file's metadata and no `data`, gets an
#     `upload_required` result with the presigned URL from `storage.create-upload-url`, sends the
#     bytes there, and retries the call with the `requestState` it got. `storage.head-object`
#     confirms the size and type before the flow runs. The flow sees the file with an `uploadId`,
#     the server-chosen name of the stored object, never its bytes; an inline file is stored the
#     same way first. The flow is not idempotent, so each `requestState` runs it at most once.
#
# Limits of hosted links and hosted uploads:
#   - a link or upload target is served only by the replica that issued it: give replicas
#     session affinity for the whole call, retry included;
#   - downloads and uploads wait in memory and share one bound per process (at most 1/8 of the
#     heap and 256 MiB); a result that does not fit is returned inline, and an upload that does
#     not fit (or goes over `uploads.quota`) is an error result. `quota: 64MiB` fits that bound
#     from a 512 MiB heap, and takes one 50 MiB report at a time. A caller the adapter can tell
#     apart (oauth2, trust: forwarded) holds at most a quarter of the bound; this adapter has no
#     caller identity, so its callers share the bound and the quota;
#   - a client resends only the `Authorization` header and the query string of the MCP address,
#     so they work with no authentication, bearer, basic, oauth2 or a query apikey; behind any
#     other (a header apikey, digest, awsSigV4), binary results stay inline and
#     `uploads.hosted: true` fails the load.
ikanos: "1.0.0-beta11"

info:
  display: "Photo library and exports (MCP files example)"
  description: >
    Return large photos and order exports to MCP clients as download targets rather than inline
    bytes, through the experimental MCP files extension.
  tags:
    - files
    - binary
    - example

capability:
  consumes:
    - type: "http"
      namespace: "photo-library"
      description: "Upstream photo library API serving original-resolution image bytes."
      baseUri: "https://photos.example.org"
      resources:
        photos:
          description: "Photo binary resource."
          path: "/photos/{{id}}/binary"
          operations:
            download-photo:
              method: "GET"
              description: "Download the original-resolution bytes of a photo by id."
              outputRawFormat: "binary"
              outputMediaType: "image/jpeg"
    - type: "http"
      namespace: "records"
      description: "Upstream records API that stores lab reports."
      baseUri: "https://records.example.org"
      resources:
        reports:
          description: "Lab report resource."
          path: "/reports"
          operations:
            import-from-storage:
              method: "PUT"
              description: "Import a scan already stored in the object store, by key."
              inputParameters:
                key:
                  in: "query"
            upload-report:
              method: "POST"
              description: "Store a lab report, sent as multipart/form-data."
              body:
                type: "multipartForm"
                data:
                  - name: "label"
                    value: "{{label}}"
                  - name: "file"
                    value: "{{report.data}}"
                    encoding: "base64"
                    filename: "{{report.name}}"
                    contentType: "{{report.mimeType}}"
    - type: "http"
      namespace: "storage"
      description: "Object store that issues presigned upload URLs for scans."
      baseUri: "https://storage.example.org"
      resources:
        upload-urls:
          description: "Presigned upload URLs."
          path: "/upload-urls/{{key}}"
          operations:
            create-upload-url:
              method: "POST"
              description: "Return a presigned PUT URL for an object, with the headers it signs."
              inputParameters:
                contentType:
                  in: "query"
                size:
                  in: "query"
                expiresIn:
                  in: "query"
        objects:
          description: "Stored objects."
          path: "/objects/{{key}}"
          operations:
            head-object:
              method: "HEAD"
              description: "Read the size and type of a stored object."
    - type: "http"
      namespace: "exports"
      description: "Upstream export API that writes files to object storage."
      baseUri: "https://exports.example.org"
      resources:
        order-exports:
          description: "Order export resource."
          path: "/exports/orders/{{quarter}}"
          operations:
            export-orders:
              method: "POST"
              description: "Export the orders of a quarter as CSV and return a presigned URL."

  aggregates:
    - display: "Documents"
      namespace: "documents"
      flows:
        import-report:
          description: "Import a lab report into the records system."
          semantics:
            idempotent: false
          inputParameters:
            report:
              type: "file"
              accept:
                - "application/pdf"
                - "text/csv"
              maxSize: "50MiB"
              required: true
              description: "The report to import."
            label:
              type: "string"
              description: "A label for the report."
          call: "records.upload-report"
        import-scan:
          description: "Import a scanned document, stored in the object store first."
          semantics:
            idempotent: false
          inputParameters:
            scan:
              type: "file"
              accept:
                - "application/pdf"
                - "image/tiff"
              maxSize: "2GiB"
              required: true
              description: "The scan to import."
          upload:
            presign:
              call: "storage.create-upload-url"
              with:
                key: "scans/{{scan.uploadId}}"
                contentType: "{{scan.mimeType}}"
                size: "{{scan.size}}"
                expiresIn: "{{scan.uploadExpiresIn}}"
              url: "$.uploadUrl"
              headers: "$.headers"
              expiresAt: "$.expiresAt"
            verify:
              call: "storage.head-object"
              with:
                key: "scans/{{scan.uploadId}}"
          call: "records.import-from-storage"
          with:
            key: "scans/{{scan.uploadId}}"

  exposes:
    - type: "rest"
      address: "0.0.0.0"
      port: 8080
      namespace: "documents-api"
      maxBinarySize: "50MiB"
      resources:
        reports:
          description: "Lab reports."
          path: "/reports"
          operations:
            import-report:
              method: "POST"
              description: "Import a lab report, sent as multipart/form-data."
              ref: "documents.import-report"
    - type: "mcp"
      address: "0.0.0.0"
      port: 8765
      namespace: "photos-mcp"
      description: "Photo library MCP server that returns large files as download targets."
      maxBinarySize: "25MiB"
      files:
        downloads:
          inlineThreshold: "1MiB"
          ttl: "PT5M"
        uploads:
          maxInlineBytes: "1MiB"
          hosted: true
          quota: "64MiB"
          ttl: "PT5M"
      tools:
        get-photo:
          description: "Download the original-resolution bytes of a photo by id."
          hints:
            readOnly: true
          inputParameters:
            id:
              type: "string"
              required: true
              description: "Photo identifier."
          call: "photo-library.download-photo"
          with:
            id: "{{id}}"
        export-orders:
          description: "Export the orders of a quarter as a CSV file."
          inputParameters:
            quarter:
              type: "string"
              required: true
              description: "Quarter to export, such as 2026-Q3."
          call: "exports.export-orders"
          with:
            quarter: "{{quarter}}"
          outputParameters:
            - type: "object"
              mapping: "$"
              properties:
                url:
                  type: "string"
                  mapping: "$.signedUrl"
                size:
                  type: "number"
                  mapping: "$.contentLength"
                file-name:
                  type: "string"
                  mapping: "$.fileName"
                expires-at:
                  type: "string"
                  mapping: "$.expiresAt"
          download:
            url: "url"
            size: "size"
            name: "file-name"
            expiresAt: "expires-at"
        import-report:
          description: "Import a lab report into the records system, uploaded to this server when large."
          ref: "documents.import-report"
        import-scan:
          description: "Import a scanned document, uploaded out of band to the object store."
          ref: "documents.import-scan"
