# yaml-language-server: $schema=ruleset-schema.json
# Ikanos Polychro Ruleset v0.6
#
# The Polychro ruleset of the Ikanos Specification.
#
# IMPORTANT:
# - This ruleset intentionally avoids duplicating constraints already enforced
#   by src/main/resources/schemas/ikanos-schema.json.
# - It focuses on cross-object consistency, style hygiene, and security checks.
# - It supports full capabilities, shared section documents (root-level
#   `consumes`, `exposes`, `aggregates`, `binds`), and import directives.
#
# Usage:
#   polychro lint --schema ikanos-schema.json --ruleset ikanos-rules.yml my-capability.yml
#
# Custom functions (functions/*.js) are called as `function(input, options)`; the
# `path` of each result is relative to the node the rule targets.
#
# Rules are organized into six categories:
#   1. Structure & consistency      — validate cross-object constraints not covered by schema
#   2. Quality & discoverability    — promote good description hygiene for agent discovery
#   3. Security                     — guard against injection and unsafe content
#   4. Control port                 — control adapter constraints
#   5. Script steps                 — script step defaults
#   6. Imports                      — unified import directive validation (§11 of blueprint)
#   7. Cache hints                  — ttlMs / cacheScope / ttlFromUpstream against the spec

extends: []

functionsDir: ./functions

functions:
  - unique-namespaces
  - aggregate-semantics-consistency
  - control-port-validation
  - script-defaults-required
  - standalone-no-imports
  - capability-no-root-sections
  - import-alias-unique
  - tunnel-identity-binds-ref
  - mcp-ui-view-mime-type
  - flow-calls
  - mcp-tool-inferred-call
  - mcp-trust-networks
  - shared-listener-mounts
  - cache-hints
  - exposes-hosts-binds-ref
  - definitions
  - durability
  - exposes-authorization
  - mcp-tool-input-examples
  - mcp-tool-search
  - mcp-tool-description
  - sql-procedures

rules:

  # ────────────────────────────────────────────────────────────────
  # 1. STRUCTURE & CONSISTENCY
  # ────────────────────────────────────────────────────────────────

  ikanos-namespaces-unique:
    message: "Namespaces must be globally unique across all adapters, aggregates and bindings."
    description: >
      The same namespace must not be reused across `capability.consumes`,
      `capability.exposes`, `capability.aggregates` and `capability.binds`, nor
      within the root section of a standalone file. Imported entries are checked under
      their effective namespace (the `as` alias, or the `import` name).
      This prevents ambiguous routing, reference resolution, and
      variable resolution: `call: namespace.name` resolves against both
      consumed adapters and aggregate flows. The engine enforces the same
      rule at startup.
    severity: error
    recommended: true
    given: "$"
    then:
      function: unique-namespaces

  ikanos-consumes-baseuri-no-trailing-slash:
    message: "The `consumes.baseUri` should not have a trailing slash."
    description: >
      A trailing slash on the baseUri can cause double-slash issues when the
      resource path is appended (e.g. https://api.example.com//users).
    severity: warn
    recommended: true
    given:
      - "$.consumes[*].baseUri"
      - "$.capability.consumes[*].baseUri"
    then:
      function: pattern
      functionOptions:
        notMatch: "/$"

  ikanos-consumed-resource-no-query-in-path:
    message: "Consumed resource `path` must not contain a query string. Use `queryParameters` or `inputParameters` with `in: query` instead."
    description: >
      Query parameters belong in the queryParameters list of names, or in
      inputParameters with in: query, not in the path string.
    severity: warn
    recommended: true
    given:
      - "$.consumes[?(@.type == 'http')].resources[*].path"
      - "$.capability.consumes[?(@.type == 'http')].resources[*].path"
    then:
      function: pattern
      functionOptions:
        notMatch: "\\?"

  ikanos-rest-resource-path-no-trailing-slash:
    message: "Exposed resource `path` must not have a trailing slash."
    description: >
      Trailing slashes on resource paths can cause confusion in routing,
      documentation, and client code generation.
    severity: warn
    recommended: true
    given: "$.capability.exposes[?(@.type == 'rest')].resources[*].path"
    then:
      function: pattern
      functionOptions:
        notMatch: "/$"

  ikanos-rest-resource-path-no-query:
    message: "Exposed resource `path` must not contain a query string. Use `inputParameters` with `in: query` instead."
    severity: warn
    recommended: true
    given: "$.capability.exposes[?(@.type == 'rest')].resources[*].path"
    then:
      function: pattern
      functionOptions:
        notMatch: "\\?"

  ikanos-address-not-example:
    message: "Server `address`, when present, should not be example.com."
    description: >
      Placeholder hosts are discouraged in production-bound capability documents.
    severity: warn
    recommended: true
    given:
      - "$.capability.exposes[?(@.type == 'rest')].address"
      - "$.capability.exposes[?(@.type == 'mcp')].address"
    then:
      function: pattern
      functionOptions:
        notMatch: "example\\.com$"

  ikanos-aggregate-flow-description:
    message: "Each aggregate flow should have a `description` field."
    description: >
      Flow descriptions are inherited by adapter units and improve agent
      discoverability.
    severity: warn
    recommended: true
    given: "$.capability.aggregates[*].flows[*]"
    then:
      field: "description"
      function: truthy

  ikanos-aggregate-semantics-consistency:
    message: "Aggregate flow semantics must be consistent with MCP tool hints and REST operation methods."
    description: >
      When an MCP tool or REST operation references an aggregate flow via `ref`,
      any explicit hints or HTTP methods should not contradict the flow's declared
      semantics. For example, a safe flow should not have destructive=true hints
      or use a POST/DELETE method.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: aggregate-semantics-consistency

  ikanos-flow-call-target-exists:
    message: "A call to an aggregate flow must name an existing flow."
    description: >
      A `call` step or a flow-level `call:` may target another aggregate flow
      (`call: namespace.flow-name`). When the namespace is an aggregate, the
      flow must exist in it. The engine rejects the capability at startup
      otherwise.
    severity: error
    recommended: true
    given: "$"
    then:
      function: flow-calls
      functionOptions:
        check: targets

  ikanos-flow-call-no-cycle:
    message: "Aggregate flows must not call each other in a cycle."
    description: >
      Flows that call flows form a graph that must be acyclic. The engine
      rejects a cycle at startup and names it.
    severity: error
    recommended: true
    given: "$"
    then:
      function: flow-calls
      functionOptions:
        check: cycles

  ikanos-exposes-call-not-flow:
    message: "Exposed MCP tools, MCP resources and REST operations must use `ref`, not `call`, to reach an aggregate flow."
    description: >
      `ref` derives the exposed unit's description, MCP hints, and input and
      output schemas from the flow. A `call:` to a flow would bypass all of
      that, so the engine rejects it at startup.
    severity: error
    recommended: true
    given: "$"
    then:
      function: flow-calls
      functionOptions:
        check: exposes

  ikanos-mcp-tool-inferred-call:
    message: "{{error}}"
    description: >
      An MCP tool that declares none of `call`, `steps`, `ref` or mock
      `outputParameters` calls the consumed operation with the same name as
      the tool (an HTTP operation or a consumed MCP tool). Exactly one consumed
      namespace must have one; with none or several, the engine rejects the
      capability at startup. Add `call:` to the tool to name the operation.
    severity: error
    recommended: true
    given: "$"
    then:
      function: mcp-tool-inferred-call

  ikanos-flow-call-semantics-conservative:
    message: "A flow's semantics must not be less conservative than the targets it calls."
    description: >
      A flow that declares `safe: true` or `idempotent: true` must only call
      targets that are too: other flows (by their effective semantics),
      consumed MCP tools (by their local `hints`), or consumed HTTP operations
      (by their method, per RFC 9110). Otherwise the flow would publish
      read-only or idempotent MCP hints that do not hold. Calls into an
      imported consumes namespace are not checked: the imported document is
      out of reach of a single-document lint.
    severity: error
    recommended: true
    given: "$"
    then:
      function: flow-calls
      functionOptions:
        check: semantics

  ikanos-definitions-reference-exists:
    message: "{{error}}"
    description: >
      `inputParameterSets: [name]` on an MCP tool, a REST resource or operation,
      or an aggregate flow must name an input parameter set, and `schema: name`
      (on an input, inside a schema, or in an orchestrated output) must name a
      schema, declared in the `definitions` of the same MCP adapter, REST
      adapter or aggregate. Definitions are local: a tool or an operation cannot
      use an aggregate's definitions (it reaches a flow through `ref`). The
      engine rejects the capability at startup otherwise.
    severity: error
    recommended: true
    given: "$"
    then:
      function: definitions
      functionOptions:
        check: references

  ikanos-definitions-set-conflict:
    message: "{{error}}"
    description: >
      The input parameter sets of one tool, REST resource or operation, or flow
      must not declare the same input: which one would win is not obvious. Keep
      the input in one set, or declare it on the unit, where it replaces the
      set's entry whole.
    severity: error
    recommended: true
    given: "$"
    then:
      function: definitions
      functionOptions:
        check: conflicts

  ikanos-definitions-schema-no-cycle:
    message: "{{error}}"
    description: >
      A schema may use another schema, but schemas must not reference each
      other in a cycle: definitions are expanded into their inline equivalent at
      load time, and a cycle has none.
    severity: error
    recommended: true
    given: "$"
    then:
      function: definitions
      functionOptions:
        check: cycles

  ikanos-definitions-unused:
    message: "{{error}}"
    description: >
      An input parameter set or schema that no tool, REST resource or
      operation, or flow of its namespace uses, directly or through another definition, is dead weight: remove it
      or use it.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: definitions
      functionOptions:
        check: unused

  ikanos-definitions-output-keywords:
    message: "{{error}}"
    description: >
      A schema used in an orchestrated (steps) output gives the output only its
      `type` (`integer` becomes `number`), its `properties`, and its `items`
      when they are objects with properties. Its input-only keywords
      (`description`, `enum`, `format`, `minimum`, `maximum`, `required`,
      `additionalProperties`) are not carried: this note flags them where the
      schema is used, so that the drop is never silent.
    severity: info
    recommended: true
    given: "$"
    then:
      function: definitions
      functionOptions:
        check: outputKeywords

  ikanos-task-mode-requires-durability:
    message: "A flow in task mode needs a durability mode on the control port."
    description: >
      `semantics.interaction.mode: task` lets an MCP client receive a task
      handle and poll for the result. The task must be kept somewhere, so the
      capability needs `durability: { mode: memory }` (or above) on its
      control port. Under `none`, the engine answers every call inline.
    severity: error
    recommended: true
    given: "$"
    then:
      function: durability
      functionOptions:
        check: task-mode

  ikanos-elicit-after-unsafe-requires-durability:
    message: "An `elicit` step after a call that is not read-only needs a durability mode."
    description: >
      Under the `none` durability mode, an answer to an `elicit` step replays
      the steps from the start with the answers collected so far (a stateless
      multi round-trip request). Every call before the question therefore runs
      again on each answer, which is only harmless when it is read-only: a
      consumed HTTP operation with a safe method, a consumed MCP tool with
      `hints.readOnly: true`, a SQL procedure without `readOnly: false`, or a
      flow with `semantics.safe: true`. Declare a
      durability mode, or ask the question before the first write.
    severity: error
    recommended: true
    given: "$"
    then:
      function: durability
      functionOptions:
        check: elicit-safety

  ikanos-sealing-key-must-bind:
    message: "{{error}}"
    description: >
      The sealing key protects the state handed to clients, such as an MCP
      `requestState`. A key written into the capability ends up in source
      control. Write a single Mustache expression naming a binding key, such as
      `{{IKANOS_SEALING_KEY}}` or `{{secrets.IKANOS_SEALING_KEY}}`, and declare
      that key in `capability.binds`. A literal key still loads, which keeps a quick local
      test possible.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: durability
      functionOptions:
        check: sealing-key-binds

  ikanos-mcp-auth-stdio-conflict:
    message: "MCP `authentication` should not be set when `transport` is `stdio`."
    description: >
      Per MCP specification §1.2, stdio transport should not follow the HTTP
      authorization flow — credentials are retrieved from the environment instead.
      Authentication is only meaningful for the HTTP transport.
    severity: warn
    recommended: true
    given: "$.capability.exposes[?(@.type == 'mcp' && @.transport == 'stdio')]"
    then:
      field: "authentication"
      function: falsy

  ikanos-oauth2-https-authserver:
    message: "OAuth2 `authorizationServerUri` must use the `https://` scheme."
    description: >
      The OAuth 2.1 specification requires all authorization server endpoints to be
      served over HTTPS. A non-HTTPS authorization server URI is a security risk.
    severity: error
    recommended: true
    given: "$.capability.exposes[*].authentication[?(@.type == 'oauth2')]"
    then:
      field: "authorizationServerUri"
      function: pattern
      functionOptions:
        match: "^https://"

  ikanos-oauth2-resource-https:
    message: "OAuth2 `resource` should use the `https://` scheme for production."
    description: >
      The resource URI identifies this server in Protected Resource Metadata and
      audience validation. Using HTTPS ensures proper security in production.
    severity: warn
    recommended: true
    given: "$.capability.exposes[*].authentication[?(@.type == 'oauth2')]"
    then:
      field: "resource"
      function: pattern
      functionOptions:
        match: "^https://"

  ikanos-oauth2-scopes-defined:
    message: "OAuth2 authentication should define `scopes` for scope challenge support."
    description: >
      Defining scopes advertises them in Protected Resource Metadata
      (`scopes_supported`) and in the OpenAPI export, improving client
      interoperability. An `authorization` block may only ask for scopes listed here.
    severity: warn
    recommended: true
    given: "$.capability.exposes[*].authentication[?(@.type == 'oauth2')]"
    then:
      field: "scopes"
      function: truthy

  ikanos-authorization-oauth2:
    message: "{{error}}"
    description: >
      An `authorization` block (on an adapter, a REST resource or operation, or an MCP
      tool) is checked against the claims of the OAuth 2.1 token the adapter
      validated. It needs `authentication: oauth2` on the adapter, and cannot be
      used on the MCP stdio transport, which carries no token. The engine refuses
      to start on the same problems.
    severity: error
    recommended: true
    given: "$"
    then:
      function: exposes-authorization
      functionOptions:
        check: oauth2

  ikanos-authorization-scopes-declared:
    message: "{{error}}"
    description: >
      Every scope listed in an `authorization` block must be one the adapter
      recognizes, listed in `authentication.scopes`, so that Protected Resource
      Metadata (`scopes_supported`) and the OpenAPI export advertise it. The
      engine refuses to start otherwise.
    severity: error
    recommended: true
    given: "$"
    then:
      function: exposes-authorization
      functionOptions:
        check: scopes

  ikanos-oauth2-scopes-not-enforced:
    message: "{{error}}"
    description: >
      `authentication.scopes` lists the scopes an OAuth 2.1 adapter recognizes;
      a token does not need them to be accepted. Scopes and claims are required
      with `authorization`, on the adapter or per resource, operation or tool. Up to
      1.0.0-beta9 the engine required every listed scope on every call, so an
      adapter that lists scopes without any `authorization` may have relied on it.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: exposes-authorization
      functionOptions:
        check: unenforced

  ikanos-exposes-mounts-distinct:
    message: >-
      {{error}}
    description: >
      Exposed adapters on the same address and port share one listener and are
      routed by `hosts`, then by `path`. On each host, two adapters must not be
      mounted at the same path (two adapters without `path` on one port count as
      both mounted at `/`), and one path must not be nested in another, such as
      `/api` and `/api/v2`. The root `/` may hold other paths. The engine
      enforces the same rule at startup.
    severity: error
    recommended: true
    given: "$"
    then:
      function: shared-listener-mounts

  ikanos-exposes-hosts-must-bind:
    message: >-
      {{error}}
    description: >
      A `hosts` entry written as a Mustache expression (for example
      `{{CUSTOM_DOMAIN}}` or `{{deploy.CUSTOM_DOMAIN}}`) is resolved from the
      bindings when the capability starts, so a deployment can inject its
      custom domain. The referenced key, and namespace when given, must be
      declared in `capability.binds`. The engine checks the resolved
      host name at startup.
    severity: error
    recommended: true
    given: "$"
    then:
      function: exposes-hosts-binds-ref

  # ────────────────────────────────────────────────────────────────
  # 2. QUALITY & DISCOVERABILITY
  # ────────────────────────────────────────────────────────────────

  ikanos-info-tags:
    message: "The `info.tags` array should be present and non-empty."
    description: >
      Tags help categorize the capability for discovery and filtering.
      At least one tag improves agent cataloging.
    severity: info
    recommended: false
    given: "$.info"
    then:
      field: "tags"
      function: truthy

  ikanos-mcp-tool-input-examples:
    message: "{{error}}"
    description: >
      An MCP tool input's `examples` are advertised to models as JSON Schema
      `examples` in the tool's inputSchema, so a wrong example teaches the model
      to send a wrong argument. Each example must be a valid value of its input:
      a number for `number`, an integer for `integer`, `true` or `false` for
      `boolean`, and one of the `enum` values when the input declares them. An
      object or array input takes no examples of its own: give them on its
      `properties` or `items`. The engine refuses to load such a capability, and
      `ikanos validate` fails on it; this rule reports the same examples earlier.
      It also asks to quote two kinds of examples that the engine accepts but
      that a YAML linter cannot read exactly: a number on a string input, and an
      integer beyond 2^53.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-input-examples

  ikanos-mcp-consumes-endpoint-https:
    message: "A consumed MCP `endpoint` must use `https://` unless it targets localhost."
    description: >
      Consumed MCP servers receive tool arguments and an upstream credential on every
      call. Plain HTTP is only acceptable for a local upstream (development, sidecar).
      An endpoint taken whole from a binding (`{{MCP_URL}}`) is checked by the engine
      when the capability loads, since its value is not known at lint time.
    severity: error
    recommended: true
    given:
      - "$.consumes[?(@.type == 'mcp')].endpoint"
      - "$.capability.consumes[?(@.type == 'mcp')].endpoint"
    then:
      function: pattern
      functionOptions:
        match: "^(https://|http://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?(/|$)|\\{\\{[A-Za-z0-9_.-]+\\}\\}$)"

  ikanos-mcp-consumed-tool-hints:
    message: "Each consumed MCP tool should declare `hints`."
    description: >
      Consumed MCP tool hints are authored locally and never derived from the
      upstream's annotations, which are untrusted. Declaring them makes the
      behaviour of the composed capability explicit and reviewable.
    severity: warn
    recommended: true
    given:
      - "$.consumes[?(@.type == 'mcp')].tools[*]"
      - "$.capability.consumes[?(@.type == 'mcp')].tools[*]"
    then:
      field: "hints"
      function: truthy

  # Consumed SQL databases (consumes type sql)

  ikanos-sql-no-inline-credentials:
    message: "A consumed SQL `connection.username`, `connection.password` or `password` driver property must come from `binds`."
    description: >
      Database credentials written in the capability end up in version control
      and in every copy of the file, whether in `connection.username`,
      `connection.password` or a `password` / `pwd` entry of
      `connection.properties`. Take them from a `binds` entry
      (`{{DB_USER}}`, `{{DB_PASSWORD}}`), resolved once when the capability
      loads.
    severity: error
    recommended: true
    given:
      - "$.consumes[?(@.type == 'sql')].connection.username"
      - "$.consumes[?(@.type == 'sql')].connection.password"
      - "$.capability.consumes[?(@.type == 'sql')].connection.username"
      - "$.capability.consumes[?(@.type == 'sql')].connection.password"
      - "$.consumes[?(@.type == 'sql')].connection.properties.password"
      - "$.consumes[?(@.type == 'sql')].connection.properties.pwd"
      - "$.capability.consumes[?(@.type == 'sql')].connection.properties.password"
      - "$.capability.consumes[?(@.type == 'sql')].connection.properties.pwd"
    then:
      function: pattern
      functionOptions:
        match: "^\\{\\{[A-Za-z0-9_.-]+\\}\\}$"

  ikanos-sql-no-url-credentials:
    message: "A consumed SQL `connection.url` must not carry a password: use `connection.password`."
    description: >
      A password in the JDBC URL (`//user:secret@host`, `password=secret`)
      ends up in version control and in every copy of the file. Bind the whole
      URL (`{{JDBC_URL}}`), or move the password to `connection.password`
      bound from `binds`.
    severity: error
    recommended: true
    given:
      - "$.consumes[?(@.type == 'sql')].connection.url"
      - "$.capability.consumes[?(@.type == 'sql')].connection.url"
    then:
      function: pattern
      functionOptions:
        # No /.../i literal: Polychro compiles the pattern as written, so letters
        # match in either case through character classes
        notMatch: "(^|[?&;:(,])\\s*([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Pp][Ww][Dd])\\s*=(?!\\s*\\{\\{)|//[^/@?;]*:[^/@?;{]+@|:[Tt][Hh][Ii][Nn]:[^@/:{]+/[^@{]+@"

  ikanos-sql-statement-read-only:
    message: "A SQL procedure `statement` must read (SELECT, WITH or VALUES) unless it declares `readOnly: false`."
    description: >
      A SQL procedure reads unless it says otherwise. The engine refuses, when
      the capability loads, a statement without `readOnly: false` that does not
      start with SELECT, WITH or VALUES, or that writes anyway (a
      data-modifying CTE, SELECT ... INTO). This rule surfaces the first case
      in the editor.
    severity: error
    recommended: true
    # Every procedure is targeted and the condition is in the schema: `procedures` is a
    # map, and Polychro applies a JSONPath filter (`[?(...)]`) to array elements only.
    given:
      - "$.consumes[?(@.type == 'sql')].procedures.*"
      - "$.capability.consumes[?(@.type == 'sql')].procedures.*"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            required: ["statement"]
            not:
              required: ["readOnly"]
              properties:
                readOnly: { const: false }
          then:
            properties:
              statement:
                # No /.../i literal: letters match in either case through character classes
                pattern: "^(\\s|\\(|--[^\\n]*\\n|#[^\\n]*\\n|/\\*[\\s\\S]*?\\*/)*([Ss][Ee][Ll][Ee][Cc][Tt]|[Ww][Ii][Tt][Hh]|[Vv][Aa][Ll][Uu][Ee][Ss])\\b"

  ikanos-sql-write-statement:
    message: "A SQL write `statement` must be INSERT, UPDATE, DELETE or MERGE (or a WITH that runs one)."
    description: >
      `readOnly: false` lets a statement change rows, never the schema: DDL,
      TRUNCATE, grants and maintenance are refused when the capability loads,
      and so are UPDATE and DELETE without WHERE. A stored procedure is called
      through `storedProcedure`, not a CALL statement.
    severity: error
    recommended: true
    # Every procedure is targeted and the condition is in the schema: `procedures` is a
    # map, and Polychro applies a JSONPath filter (`[?(...)]`) to array elements only.
    given:
      - "$.consumes[?(@.type == 'sql')].procedures.*"
      - "$.capability.consumes[?(@.type == 'sql')].procedures.*"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            required: ["statement", "readOnly"]
            properties:
              readOnly: { const: false }
          then:
            properties:
              statement:
                # No /.../i literal: letters match in either case through character classes
                pattern: "^(\\s|--[^\\n]*\\n|#[^\\n]*\\n|/\\*[\\s\\S]*?\\*/)*([Ii][Nn][Ss][Ee][Rr][Tt]|[Uu][Pp][Dd][Aa][Tt][Ee]|[Dd][Ee][Ll][Ee][Tt][Ee]|[Mm][Ee][Rr][Gg][Ee]|[Ww][Ii][Tt][Hh])\\b"

  ikanos-sql-write-exposure:
    message: "{{error}}"
    description: >
      A SQL procedure with `readOnly: false` changes data. An exposed MCP tool
      that reaches it must not claim `hints.readOnly: true`, nor inherit it
      from the `hints` of its MCP exposes block, an MCP resource must not
      reach it, a REST operation that reaches it must not use GET or
      HEAD, and an aggregate flow that reaches it must not declare
      `semantics.safe: true`: agents and clients rely on those claims to call
      without asking. A target reaches a procedure through its `call`, its
      steps, its `ref`, and the flows those name, followed transitively.
      The engine also refuses to load an MCP tool that resolves
      `readOnly: true`, declared or inherited, and reaches a write.
    severity: error
    recommended: true
    given: "$"
    then:
      function: sql-procedures
      functionOptions:
        check: exposure

  ikanos-sql-placeholders-bound:
    message: "{{error}}"
    description: >
      Every `{{name}}` placeholder in a SQL procedure `statement` must name a
      declared input, and every input must be used. A placeholder must stand
      outside string literals and quoted identifiers, where it would not be
      bound. A statement holds the database's own SQL only: no JDBC escape
      (`{fn ...}`, `{d '...'}`, `{call ...}`), no `?` marker (outside
      PostgreSQL, where `?` is a JSONB operator) and, on Oracle, no `:name`
      marker. The engine binds each placeholder itself, and refuses all of
      these when the capability loads.
    severity: error
    recommended: true
    given: "$"
    then:
      function: sql-procedures
      functionOptions:
        check: placeholders

  ikanos-sql-stored-procedure-read-only:
    message: "A SQL `storedProcedure` must declare `readOnly`."
    description: >
      The engine cannot see inside a stored procedure, so it cannot tell whether
      a call changes data. `readOnly: true` is the author's statement that it
      does not; the engine refuses a stored procedure without the field when
      the capability loads.
    severity: error
    recommended: true
    # Every procedure is targeted and the condition is in the schema: `procedures` is a
    # map, and Polychro applies a JSONPath filter (`[?(...)]`) to array elements only.
    given:
      - "$.consumes[?(@.type == 'sql')].procedures.*"
      - "$.capability.consumes[?(@.type == 'sql')].procedures.*"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            required: ["storedProcedure"]
          then:
            required: ["readOnly"]

  ikanos-sql-stored-procedure-parameters:
    message: "{{error}}"
    description: >
      A stored procedure binds its arguments by position: every input declares
      a `position`, and positions across `inputParameters` and `outParameters`
      are unique and contiguous from 1. An `INOUT` parameter takes the same
      position in both. `outParameters` only apply to a `storedProcedure`.
    severity: error
    recommended: true
    given: "$"
    then:
      function: sql-procedures
      functionOptions:
        check: positions

  # MCP Apps (SEP-1865) — interactive ui:// views linked from exposed MCP tools

  ikanos-mcp-ui-resource-mime-type:
    message: "{{error}}"
    description: >
      MCP Apps hosts only render views served as `text/html;profile=mcp-app`.
      An exposed MCP resource whose `uri` starts with `ui://` must declare that
      `mimeType`. The engine refuses to start when a tool's `ui.resourceUri`
      resolves to a different type; this rule surfaces the error in the editor.
    severity: error
    recommended: true
    given: "$"
    then:
      function: mcp-ui-view-mime-type

  ikanos-mcp-ui-tool-output-parameters:
    message: "An MCP tool with `ui` should declare `outputParameters`."
    description: >
      Without `outputParameters`, the tool returns text only and advertises no
      `outputSchema`, so its MCP Apps view receives no typed `structuredContent`
      to render.
    severity: warn
    recommended: true
    # Every tool is targeted and the condition is in the schema: `tools` is a map, and
    # Polychro applies a JSONPath filter (`[?(...)]`) to array elements only. On a map,
    # it tests the map itself, so `tools[?(@.ui)]` selected nothing.
    given:
      - "$.capability.exposes[?(@.type == 'mcp')].tools.*"
      - "$.exposes[?(@.type == 'mcp')].tools.*"
    then:
      function: schema
      functionOptions:
        schema:
          if:
            required: ["ui"]
          then:
            required: ["outputParameters"]

  ikanos-mcp-ui-connect-domains-empty:
    message: "This MCP Apps view declares `csp.connectDomains`, so it can reach origins outside the capability."
    description: >
      With no `connectDomains`, the view's only data path is `tools/call`
      through this capability, its authentication and its output mappings.
      Each connect domain opens a second path the capability does not govern.
      Prefer calling a tool instead.
    severity: info
    recommended: true
    given:
      - "$.capability.exposes[?(@.type == 'mcp')].resources[*].ui.csp.connectDomains"
      - "$.exposes[?(@.type == 'mcp')].resources[*].ui.csp.connectDomains"
    then:
      function: length
      functionOptions:
        max: 0

  # Agent Skills over MCP (SEP-2640) — skills served by an exposed MCP adapter

  ikanos-mcp-tool-search-reserved-names:
    message: "{{error}}"
    description: >
      An MCP adapter that declares `toolSearch` advertises two meta-tools in
      deferred mode, `search-tools` and `call-tool` unless renamed. A tool with
      one of those names would be shadowed, so the engine refuses to load.
    severity: error
    recommended: true
    given: "$"
    then:
      function: mcp-tool-search
      functionOptions:
        check: reservedNames

  ikanos-mcp-tool-search-implicit-reserved-names:
    message: "{{error}}"
    description: >
      Without a `toolSearch` block, clients may still select deferred mode with
      `?toolSearch=deferred`. A tool named `search-tools` or `call-tool` blocks
      that: the engine loads the capability but disables tool search for clients.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-search
      functionOptions:
        check: implicitReservedNames

  ikanos-mcp-tool-search-lookalike-names:
    message: "{{error}}"
    description: >
      Tool names may use underscores, so a tool can be named `search_tools` or
      `call_tool`. Models confuse such a tool with the meta-tools of deferred
      mode, and with the tool search tools of other MCP frameworks.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-search
      functionOptions:
        check: lookalikeNames

  ikanos-mcp-tool-search-always-listed-exists:
    message: "{{error}}"
    description: >
      Each `toolSearch.alwaysListed` entry must name a tool of the same MCP
      adapter. The engine refuses to load otherwise; this rule surfaces the
      typo in the editor.
    severity: error
    recommended: true
    given: "$"
    then:
      function: mcp-tool-search
      functionOptions:
        check: alwaysListedExists

  ikanos-mcp-tool-search-always-listed-size:
    message: "{{error}}"
    description: >
      Pinned tools are sent on every request in deferred mode. Keep
      `alwaysListed` to the three to five tools most calls need.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-search
      functionOptions:
        check: alwaysListedSize

  ikanos-mcp-tool-search-description:
    message: "{{error}}"
    description: >
      The search meta-tool's description is generated from the server
      `description` and the tool tags, so the model knows what it can find
      without listing the tools. Deferred mode needs that description.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-search
      functionOptions:
        check: description

  ikanos-mcp-tool-search-small-catalog:
    message: "{{error}}"
    description: >
      Deferred mode trades tool definitions for a search round trip. Below ten
      tools, the definitions usually cost less than the extra request.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-search
      functionOptions:
        check: smallCatalog

  # MCP tool descriptions: what the model and tool search tell tools apart by

  ikanos-mcp-tool-description:
    message: "{{error}}"
    description: >
      A tool's description is how the model tells what it does. A listed tool
      with a blank description, or a `ref` tool whose flow has none, leaves the
      model only the name. Tools pinned with `toolSearch.alwaysListed` count as
      listed.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-description
      functionOptions:
        check: missing

  ikanos-mcp-tool-description-deferred:
    message: "{{error}}"
    description: >
      In deferred mode, search finds tools mostly through their descriptions.
      A tool without one can only be found by its name. Reported instead of
      ikanos-mcp-tool-description on the tools that deferred tool search hides
      (those not pinned with `alwaysListed`).
    severity: error
    recommended: true
    given: "$"
    then:
      function: mcp-tool-description
      functionOptions:
        check: deferredMissing

  ikanos-mcp-tool-description-restates-name:
    message: "{{error}}"
    description: >
      A description that only repeats the tool name ("sync_application syncs
      application") adds nothing for the model or for tool search. Fires when,
      once the name's words and filler words are removed, fewer than two words
      are left. A heuristic, so it stays a warning in deferred mode too: an
      error would let a false positive fail the build.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-description
      functionOptions:
        check: restatesName

  ikanos-mcp-tool-description-similar:
    message: "{{error}}"
    description: >
      Two tools of the same adapter whose descriptions share 80% or more of
      their words are ranked side by side by tool search, and the model can
      call one for the other. Fires on the second tool of the pair. A heuristic,
      so it stays a warning in deferred mode too.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: mcp-tool-description
      functionOptions:
        check: similar

  ikanos-mcp-skill-allowed-tools:
    message: "`allowed-tools` is a request, not a grant: hosts ignore it for skills served over MCP unless the user approves it."
    description: >
      SEP-2640 requires hosts to ignore `allowed-tools` for MCP-origin skills
      unless the user has explicitly approved that grant for that skill. A
      skill that relies on it may run with fewer tools than its author expects.
      Describe the tools the workflow needs in the skill body instead.
    severity: warn
    recommended: true
    given:
      - "$.capability.exposes[?(@.type == 'mcp')].skills[*]"
      - "$.exposes[?(@.type == 'mcp')].skills[*]"
    then:
      field: "allowed-tools"
      function: falsy

  ikanos-skill-adapter-removed:
    message: "The 'skill' adapter was removed in Ikanos engine 1.0.0-beta9. Move its skills into a `skills` block on a `type: mcp` adapter; see https://github.com/naftiko/ikanos/issues/898."
    description: >
      The engine and `ikanos validate` refuse a `type: skill` adapter with this
      message. The schema alone only reports it as a `oneOf` mismatch against
      the remaining adapter types, so this rule gives tools that rely on the
      schema and rules (Polychro lint runs, editors) the same migration
      guidance. The message is kept identical to
      `ServerSpecDeserializer.SKILL_ADAPTER_REMOVED` by a test.
    severity: error
    recommended: true
    given:
      - "$.capability.exposes[?(@.type == 'skill')]"
      - "$.exposes[?(@.type == 'skill')]"
    then:
      field: "type"
      function: falsy

  ikanos-consumes-description:
    message: "Each `consumes` entry should have a `description` field."
    description: >
      A description of the consumed API improves agent understanding of
      what external service is being used and why.
    severity: warn
    recommended: true
    given:
      - "$.consumes[*]"
      - "$.capability.consumes[*]"
    then:
      field: "description"
      function: truthy

  ikanos-rest-resource-description:
    message: "Each exposed REST resource should have a `description` field."
    description: >
      Resource descriptions are used by agents to understand the purpose of
      each endpoint. In a world of agents, context is king.
    severity: warn
    recommended: true
    given: "$.capability.exposes[?(@.type == 'rest')].resources[*]"
    then:
      field: "description"
      function: truthy

  ikanos-rest-operation-description:
    message: "Exposed REST operations should have a `description` field."
    description: >
      Analogous to operation-description in OAS. Descriptions help agents
      understand which operations to invoke and when.
    severity: info
    recommended: false
    given: "$.capability.exposes[?(@.type == 'rest')].resources[*].operations[*]"
    then:
      field: "description"
      function: truthy

  # ikanos-steps-name-pattern was removed: step names are now map keys in the
  # named-object format (alpha3+). The pattern ^[A-Za-z0-9_-]+$ is enforced
  # by the JSON Schema propertyNames/IdentifierKebab constraint on every steps
  # map, making this Polychro rule redundant.

  # ────────────────────────────────────────────────────────────────
  # 3. SECURITY
  # ────────────────────────────────────────────────────────────────

  ikanos-no-script-tags-in-markdown:
    message: "Markdown fields must not contain <script> tags."
    description: >
      Analogous to no-script-tags-in-markdown (OAS) and arazzo-no-script-tags-in-markdown.
      Protects against XSS attacks when capability documents from third parties
      are rendered in HTML documentation or agent UIs.
    severity: error
    recommended: true
    given:
      - "$.info.description"
      - "$.info.label"
      - "$.capability.exposes[*].description"
      - "$.capability.exposes[?(@.type == 'rest')].resources[*].description"
      - "$.capability.exposes[?(@.type == 'rest')].resources[*].operations[*].description"
      - "$.capability.exposes[?(@.type == 'mcp')].tools[*].description"
      - "$.capability.exposes[?(@.type == 'mcp')].skills[*].description"
      - "$.consumes[*].description"
      - "$.capability.consumes[*].description"
    then:
      function: pattern
      functionOptions:
        notMatch: "<script"

  ikanos-no-eval-in-markdown:
    message: "Markdown fields must not contain eval() calls."
    description: >
      Analogous to no-eval-in-markdown (OAS). Protects against JavaScript
      injection attacks when description content is rendered in
      HTML/JS-based documentation or agent tooling.
    severity: error
    recommended: true
    given:
      - "$.info.description"
      - "$.info.label"
      - "$.capability.exposes[*].description"
      - "$.capability.exposes[?(@.type == 'rest')].resources[*].description"
      - "$.capability.exposes[?(@.type == 'rest')].resources[*].operations[*].description"
      - "$.capability.exposes[?(@.type == 'mcp')].tools[*].description"
      - "$.capability.exposes[?(@.type == 'mcp')].skills[*].description"
      - "$.consumes[*].description"
      - "$.capability.consumes[*].description"
    then:
      function: pattern
      functionOptions:
        notMatch: "eval\\("

  ikanos-baseuri-not-example:
    message: "The `consumes.baseUri` should not point to example.com."
    description: >
      Analogous to oas2-host-not-example and oas3-server-not-example.com.
      Placeholder example.com URIs should never appear in production-bound
      capability documents — use real service URLs instead.
    severity: warn
    recommended: false
    given:
      - "$.consumes[*].baseUri"
      - "$.capability.consumes[*].baseUri"
    then:
      function: pattern
      functionOptions:
        notMatch: "example\\.com"

  ikanos-mcp-trust-network-too-broad:
    message: "{{error}}"
    description: >
      In `trust: forwarded` mode, any direct peer in `trustedNetworks` can set the
      agent identity header. A network wider than an IPv4 /8 or an IPv6 /16
      (0.0.0.0/0 and ::/0 included) trusts far more than the gateway: in Kubernetes
      even 10.0.0.0/8 means every pod. List the gateway's own addresses, and pair
      `forwarded` with `authentication` so the gateway is authenticated too.
    severity: warn
    recommended: true
    given:
      - "$.capability.exposes[?(@.type == 'mcp' && @.trust)]"
      - "$.exposes[?(@.type == 'mcp' && @.trust)]"
    then:
      function: mcp-trust-networks
      functionOptions:
        check: broad

  ikanos-mcp-trust-loopback-on-public-address:
    message: "{{error}}"
    description: >
      In `trust: forwarded` mode, trusting loopback (127.0.0.0/8, ::1) on an adapter
      that listens beyond loopback lets any co-located process or sidecar set the
      agent identity header. Trust loopback only when the adapter itself listens on
      loopback.
    severity: warn
    recommended: true
    given:
      - "$.capability.exposes[?(@.type == 'mcp' && @.trust)]"
      - "$.exposes[?(@.type == 'mcp' && @.trust)]"
    then:
      function: mcp-trust-networks
      functionOptions:
        check: loopback

  # ────────────────────────────────────────────────────────────────
  # 4. CONTROL PORT
  # ────────────────────────────────────────────────────────────────

  ikanos-control-port-singleton-and-unique:
    message: "Control port validation failed."
    description: >
      At most one type: control adapter is allowed per capability, and its
      port must not conflict with any business adapter port.
    severity: error
    recommended: true
    given: "$"
    then:
      function: control-port-validation

  ikanos-control-address-localhost-warning:
    message: "Control adapter `address` should be `localhost` or `127.0.0.1` for security."
    description: >
      Binding the control port to a non-localhost address exposes management
      endpoints to the network. Use a Kubernetes NetworkPolicy or firewall
      rule to restrict access in production.
    severity: warn
    recommended: true
    given: "$.capability.exposes[?(@.type == 'control')].address"
    then:
      function: pattern
      functionOptions:
        match: "^(localhost|127\\.0\\.0\\.1)$"

  # ────────────────────────────────────────────────────────────────
  # 5. SCRIPT STEPS
  # ────────────────────────────────────────────────────────────────

  ikanos-script-defaults-required:
    message: >-
      {{error}}
    description: >
      Every script step must have a resolvable scripts directory and language.
      When a step omits 'location' or 'language', the engine falls back to
      'management.scripting.defaultLocation' or 'management.scripting.defaultLanguage'
      on the control adapter. If neither is set, the capability will fail at load time.
      This rule catches the misconfiguration at lint time.
    severity: error
    recommended: true
    given: "$"
    then:
      function: script-defaults-required

  # ────────────────────────────────────────────────────────────────
  # 6. IMPORTS — Unified import directive validation
  # ────────────────────────────────────────────────────────────────
  # See blueprints/unified-import-mechanism.md §11 for the full rule catalog.
  # Cross-file reference integrity (§11.2) is enforced by the engine resolver,
  # not by the ruleset, because it requires file-system access.

  # §11.1 — Import directive structure

  ikanos-import-from-required:
    message: "Import entry must have both 'from' and 'import' fields."
    description: >
      Every import entry in a capability's consumes, exposes, aggregates, or binds
      section must specify 'from' (the source file path) and 'import' (the namespace
      to take from that source). An entry with only one of the two is invalid.
    severity: error
    recommended: true
    given:
      - "$.capability.consumes[?(@.from)]"
      - "$.capability.exposes[?(@.from)]"
      - "$.capability.aggregates[?(@.from)]"
      - "$.capability.binds[?(@.from)]"
    then:
      field: "import"
      function: truthy

  ikanos-import-import-required:
    message: "Import entry must have both 'from' and 'import' fields."
    description: >
      Complement of ikanos-import-from-required: catches entries that have 'import'
      but are missing 'from'.
    severity: error
    recommended: true
    given:
      - "$.capability.consumes[?(@.import && !@.type)]"
      - "$.capability.exposes[?(@.import && !@.type)]"
      - "$.capability.aggregates[?(@.import && !@.type)]"
      - "$.capability.binds[?(@.import && !@.type)]"
    then:
      field: "from"
      function: truthy

  ikanos-import-unique-alias:
    message: "Import alias uniqueness validation failed."
    description: >
      Within each section of a capability, the effective namespace of imported entries
      (the 'as' alias, or 'import' when no 'as') must be unique. Duplicate effective
      namespaces would cause ambiguous resolution after imports are materialized.
    severity: error
    recommended: true
    given: "$"
    then:
      function: import-alias-unique

  ikanos-import-from-not-self:
    message: "Import 'from' should not point to the current directory."
    description: >
      An import 'from' field that is a bare dot ('.') is always an authoring error
      because it resolves to the importing file's own directory.
      The engine resolver catches the actual self-reference at runtime.
    severity: warn
    recommended: true
    given:
      - "$.capability.consumes[?(@.from)].from"
      - "$.capability.exposes[?(@.from)].from"
      - "$.capability.aggregates[?(@.from)].from"
      - "$.capability.binds[?(@.from)].from"
    then:
      function: pattern
      functionOptions:
        notMatch: "^\\.$"

  # §11.3 — Layer enforcement (standalone files must not contain imports)

  ikanos-standalone-no-imports:
    message: "{{error}}"
    description: >
      Standalone section files (documents without a 'capability' key) are leaves
      in the import DAG. They must not contain import entries (entries with a 'from'
      field). Only capability documents may import from other files.
    severity: error
    recommended: true
    given: "$"
    then:
      function: standalone-no-imports

  ikanos-capability-no-root-sections:
    message: "{{error}}"
    description: >
      A capability document keeps its 'consumes', 'exposes', 'aggregates' and
      'binds' under 'capability'. At the root, these sections are only valid in
      standalone shared files, and the engine refuses to start a capability that
      declares one. Bindings, for example, go under 'capability.binds'.
    severity: error
    recommended: true
    given: "$"
    then:
      function: capability-no-root-sections

  # §11.4 — Section-specific: namespace required (importability)

  ikanos-exposes-namespace-required:
    message: "Each exposed adapter must have a 'namespace' to be importable."
    description: >
      Without a namespace, an exposed adapter cannot be referenced by an
      import directive from another file. Applies to standalone source files
      (root-level 'exposes' array) and to inline entries under
      'capability.exposes' that declare a 'type' (i.e. local definitions,
      not import entries — which have 'from' instead). Control adapters are
      skipped: the schema does not allow a 'namespace' on them.
    severity: error
    recommended: true
    given:
      - "$.exposes[?(@.type != 'control')]"
      - "$.capability.exposes[?(@.type && @.type != 'control')]"
    then:
      field: "namespace"
      function: truthy

  ikanos-aggregates-namespace-required:
    message: "Each aggregate must have a 'namespace' to be importable."
    description: >
      Without a namespace, an aggregate cannot be referenced by an import
      directive from another file. Applies to standalone source files
      (root-level 'aggregates' array) and to inline entries under
      'capability.aggregates' that declare 'flows' (i.e. local
      definitions, not import entries — which have 'from' instead).
    severity: error
    recommended: true
    given:
      - "$.aggregates[*]"
      - "$.capability.aggregates[?(@.flows)]"
    then:
      field: "namespace"
      function: truthy

  # Reverse Tunnel (blueprint: reverse-tunnel-private-network.md, Phase 1)

  ikanos-tunnel-identity-must-bind:
    message: "tunnel.identity must reference a declared binding."
    description: >
      When a ConsumesHttp 'tunnel' uses Mustache references in 'identity'
      (for example `{{ZITI_IDENTITY}}` or `{{secrets.ZITI_IDENTITY}}`), every
      referenced key, and namespace when given, must be declared in the document's
      'capability.binds' section.
      Bare filesystem paths are accepted but discouraged.
    severity: error
    recommended: true
    given: "$"
    then:
      function: tunnel-identity-binds-ref

  ikanos-tunnel-fallback-direct-warns:
    message: >
      'tunnel.fallback: direct' on a non-loopback baseUri silently bypasses the
      tunnel and may leak traffic. Use 'fail' unless the baseUri itself is
      private/loopback.
    description: >
      A direct fallback means the engine will skip the tunnel and dial the baseUri
      directly when the tunnel cannot be opened. For public baseUris this defeats
      the privacy guarantees of the tunnel. Use 'fail' (the default) and let the
      operator decide how to recover.
    severity: warn
    recommended: true
    given:
      - "$.capability.consumes[?(@.tunnel && @.tunnel.fallback == 'direct')].baseUri"
      - "$.consumes[?(@.tunnel && @.tunnel.fallback == 'direct')].baseUri"
    then:
      function: pattern
      functionOptions:
        match: "^https?://(127\\.0\\.0\\.1|localhost|\\[::1\\])(:|/|$)"

  ikanos-tunnel-with-public-baseuri-warns:
    message: >
      Tunnel target uses a public TLD baseUri — confirm the hostname truly resolves
      through the tunnel and not via public DNS.
    description: >
      A 'tunnel' is intended for reaching APIs on private networks. When the
      baseUri points to a public TLD (.com, .net, .io, ...), the configuration
      may still be correct (the tunnel can override DNS), but it is worth
      double-checking that the upstream is not unintentionally reached over the
      public internet.
    severity: info
    recommended: true
    given:
      - "$.capability.consumes[?(@.tunnel)].baseUri"
      - "$.consumes[?(@.tunnel)].baseUri"
    then:
      function: pattern
      functionOptions:
        notMatch: "^https?://[^/]+\\.(com|net|org|io|co|app|dev|cloud|ai)(:|/|$)"

  # Cache hints (MCP 2026-07-28 ttlMs/cacheScope, REST Cache-Control) — #1022

  ikanos-cache-public-caller-dependent:
    message: "{{error}}"
    description: >
      A `cacheScope: public` lets a shared cache serve a result to any caller. When
      the adapter authenticates its callers (or, for MCP, identifies them through
      `trust`), or a REST `GET` operation reads an input from outside the URL (a
      header, or the body) that has no literal `value`, its own or one from its
      `inputParameterSets`, the result may depend on who is calling. Only results that can be cached are reported: a positive `ttlMs`
      (MCP's default is 0, REST sends no `Cache-Control` without one) or, on an MCP
      resource, `ttlFromUpstream`. It can be intended, for a public catalogue behind
      authentication, so this is a warning; `auto` derives the safe scope.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: cache-hints
      functionOptions:
        check: caller-dependent

  ikanos-cache-ttl-from-upstream-no-effect:
    message: "{{error}}"
    description: >
      `ttlFromUpstream` reads the TTL from the caching headers of a single HTTP
      upstream answer. It has no effect on a static resource (`location`), a
      resource with `steps`, or a resource that calls an MCP consumed adapter, which
      sends no HTTP caching headers. Set `ttlMs` instead.
    severity: warn
    recommended: true
    given: "$"
    then:
      function: cache-hints
      functionOptions:
        check: ttl-from-upstream-no-effect
