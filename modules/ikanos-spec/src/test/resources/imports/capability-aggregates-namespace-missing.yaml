# Capability with an inline `aggregates` entry (declares `flows`) that lacks `namespace`.
# Tests the `$.capability.aggregates[?(@.flows)]` JSONPath of the rule: import entries,
# which have `from` instead of `flows`, are not targeted.
# Should trigger: ikanos-aggregates-namespace-required
ikanos: "1.0.0-beta11"

capability:
  aggregates:
    - title: Weather Service
      # missing: namespace
      flows:
        get-forecast:
          description: Get weather forecast
          call: weather-api.get-forecast
