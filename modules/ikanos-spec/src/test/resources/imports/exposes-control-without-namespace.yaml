# Standalone source file with a `control` exposes entry and no `namespace`.
# The schema does not allow `namespace` on control adapters, so the rule must skip them.
# Should NOT trigger: ikanos-exposes-namespace-required
ikanos: "1.0.0-beta8"

exposes:
  - type: control
    address: localhost
    port: 9090
    management:
      health: true
