# Polychro fixture — cache hint rules MUST FIRE (#1022):
#   - ikanos-cache-public-caller-dependent, eight times:
#       REST `list-items` (own public scope, authenticated adapter),
#       REST `list-offers` (own public scope, header input),
#       REST `list-deals` (public scope inherited from its adapter, body input),
#       REST `list-coupons` and `list-vouchers` (header input from an input
#       parameter set, on the resource and on the operation),
#       the authenticated MCP adapter and its resource `orders`,
#       the MCP adapter that identifies its callers with `trust: forwarded`
#   - ikanos-cache-ttl-from-upstream-no-effect, five times: a static resource, a
#       resource with steps, and a resource calling an MCP consumed adapter, then
#       the same static and steps shapes on `static-mcp`, an authenticated public
#       adapter with no ttlMs: there ttlFromUpstream caches nothing, so its public
#       scopes give no caller-dependent warning
ikanos: "1.0.0-beta11"
info:
  display: "Cache hint violations"
  description: "Capability whose cache settings contradict what it declares."
capability:
  consumes:
    - type: "http"
      namespace: "shop"
      description: "Shop API."
      baseUri: "https://shop.example.org/v1"
      resources:
        items:
          path: "/items"
          operations:
            list-items:
              method: "GET"
    - type: "mcp"
      namespace: "tools-upstream"
      description: "Tools upstream."
      endpoint: "https://tools.example.org/mcp"
      tools:
        lookup:
          hints:
            readOnly: true
  exposes:
    - type: "rest"
      port: 8080
      namespace: "shop-rest"
      ttlMs: 60000
      authentication:
        type: "bearer"
        token: "{{API_TOKEN}}"
      resources:
        items:
          path: "/items"
          description: "Items."
          operations:
            list-items:
              method: "GET"
              description: "List items."
              cacheScope: "public"
              call: "shop.list-items"
    - type: "rest"
      port: 8083
      namespace: "offers-rest"
      ttlMs: 60000
      resources:
        offers:
          path: "/offers"
          description: "Offers for the caller's tenant."
          operations:
            list-offers:
              method: "GET"
              description: "List offers."
              cacheScope: "public"
              inputParameters:
                tenant:
                  in: "header"
                  type: "string"
              call: "shop.list-items"
    - type: "rest"
      port: 8084
      namespace: "deals-rest"
      ttlMs: 60000
      cacheScope: "public"
      resources:
        deals:
          path: "/deals"
          description: "Deals filtered by a body input."
          operations:
            list-deals:
              method: "GET"
              description: "List deals."
              inputParameters:
                filter:
                  type: "string"
              call: "shop.list-items"
    - type: "rest"
      port: 8087
      namespace: "tenant-rest"
      ttlMs: 60000
      cacheScope: "public"
      definitions:
        inputParameterSets:
          tenant:
            tenant:
              in: "header"
              type: "string"
              description: "The caller's tenant."
      resources:
        coupons:
          path: "/coupons"
          description: "Coupons of the caller's tenant."
          inputParameterSets: ["tenant"]
          operations:
            list-coupons:
              method: "GET"
              description: "List coupons."
              call: "shop.list-items"
        vouchers:
          path: "/vouchers"
          description: "Vouchers of the caller's tenant."
          operations:
            list-vouchers:
              method: "GET"
              description: "List vouchers."
              inputParameterSets: ["tenant"]
              call: "shop.list-items"
    - type: "mcp"
      port: 8081
      namespace: "shop-mcp"
      description: "Shop MCP server."
      ttlMs: 60000
      cacheScope: "public"
      authentication:
        type: "bearer"
        token: "{{MCP_TOKEN}}"
      tools:
        hello:
          description: "Say hello."
          outputParameters:
            msg:
              type: "string"
              value: "hi"
      resources:
        orders:
          display: "Orders"
          uri: "data://orders"
          description: "The caller's orders."
          cacheScope: "public"
          call: "shop.list-items"
        docs:
          display: "Docs"
          uri: "docs://shop"
          description: "Static docs."
          location: "file:///srv/docs"
          ttlFromUpstream: true
        composed:
          display: "Composed"
          uri: "data://composed"
          description: "Composed from steps."
          ttlFromUpstream: true
          steps:
            - name: items
              type: "call"
              what: "shop.list-items"
        lookup:
          display: "Lookup"
          uri: "data://lookup"
          description: "Read through an MCP upstream."
          ttlFromUpstream: true
          call: "tools-upstream.lookup"
    - type: "mcp"
      port: 8085
      namespace: "gateway-mcp"
      description: "MCP server behind an identity-forwarding gateway."
      ttlMs: 60000
      cacheScope: "public"
      trust:
        mode: "forwarded"
        agentIdentityHeader: "X-Agent-Id"
        trustedNetworks: ["10.20.0.0/16"]
      tools:
        hello:
          description: "Say hello to the caller."
          outputParameters:
            msg:
              type: "string"
              value: "hi"
    - type: "mcp"
      port: 8086
      namespace: "static-mcp"
      description: "Authenticated, public, no ttlMs: ttlFromUpstream has no effect."
      cacheScope: "public"
      authentication:
        type: "bearer"
        token: "{{MCP_TOKEN}}"
      tools:
        hello:
          description: "Say hello."
          outputParameters:
            msg:
              type: "string"
              value: "hi"
      resources:
        guide:
          display: "Guide"
          uri: "docs://guide"
          description: "Static guide."
          cacheScope: "public"
          location: "file:///srv/guide"
          ttlFromUpstream: true
        summary:
          display: "Summary"
          uri: "data://summary"
          description: "Composed from steps, scope inherited from the adapter."
          ttlFromUpstream: true
          steps:
            - name: items
              type: "call"
              what: "shop.list-items"
