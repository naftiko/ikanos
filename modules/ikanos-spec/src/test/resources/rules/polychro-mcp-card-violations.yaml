# Polychro fixture — every ikanos-mcp-card-* rule MUST FIRE (issue #1165).
#
# The card has no name source (no info.publisher, no card.name), a version range,
# a description over 100 characters, a wildcard address without card.url,
# authenticated: true without authentication, and a repository off the known forges.
ikanos: "1.0.0-beta11"

info:
  display: "Server card violations"
  description: "Fixture for the MCP server card rules (issue #1165)."
  version: "^1.4.0"
  repositoryUrl: "https://git.example.com/shipyard"

capability:
  exposes:
    - type: "mcp"
      address: "0.0.0.0"
      port: 3001
      namespace: "shipyard-tools"
      description: "Shipyard MCP tools for fleet management, with a description that runs well past the one hundred characters a server card allows."
      card:
        authenticated: true
      tools:
        ping:
          description: "Answer with ok to check the server is up."
          outputParameters:
            msg:
              type: "string"
              value: "ok"
