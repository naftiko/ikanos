---
# Spectral fixture — ikanos-mcp-trust-loopback-on-public-address MUST NOT FIRE.
#
# Loopback peers are trusted, but the adapter itself only listens on loopback.
ikanos: "1.0.0-beta9"

info:
  display: "MCP trust — loopback on a loopback address"
  description: "Fixture for the MCP trust network rules (issue #483)."

capability:
  exposes:
    - type: "mcp"
      address: "127.0.0.1"
      port: 3001
      namespace: "gateway-mcp"
      description: "MCP server behind an identity-forwarding gateway."
      trust:
        mode: "forwarded"
        agentIdentityHeader: "X-Agent-Id"
        trustedNetworks: ["127.0.0.1/32"]
      tools:
        hello:
          description: "Say hello to the caller."
          outputParameters:
            msg:
              type: "string"
              value: "hi"
