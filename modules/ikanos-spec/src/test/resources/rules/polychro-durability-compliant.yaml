ikanos: 1.0.0-beta9
info:
  display: Durability compliant
  description: Positive fixture for the durability rules, under the memory mode
binds:
- namespace: secrets
  description: Deployment secrets
  keys:
    IKANOS_SEALING_KEY: ikanos-sealing-key
capability:
  consumes:
  - type: http
    namespace: port
    description: Port Authority API
    baseUri: https://port.example.com
    resources:
      checks:
        path: /dangerous-goods/checks
        operations:
          check-dangerous-goods:
            method: GET
      slots:
        path: /departure-slots
        operations:
          book-departure-slot:
            method: POST
  aggregates:
  - display: departure flows
    namespace: departure
    flows:
      clear-for-departure:
        description: Task flow on the memory mode
        semantics:
          interaction:
            mode: task
        steps:
          screen:
            type: call
            call: port.check-dangerous-goods
          confirm:
            type: elicit
            message: Confirm the dangerous-goods declaration
            fields:
              confirmed:
                type: boolean
          book-slot:
            type: call
            call: port.book-departure-slot
  exposes:
  - type: mcp
    address: localhost
    port: 9313
    namespace: shipyard-ops
    description: Shipyard operations
    tools:
      clear-for-departure:
        description: Clear a voyage for departure
        ref: departure.clear-for-departure
  - type: control
    address: localhost
    port: 9314
    durability:
      mode: memory
      retention: P7D
      sealingKey: "{{secrets.IKANOS_SEALING_KEY}}"
