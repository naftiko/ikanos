ikanos: "1.0.0-beta10"
info:
  display: "Mapped definitions violations"
  description: "Mistakes binding schemas in mapped (call-mode) outputs (#1036)."
  tags:
    - Test
capability:
  consumes:
    - type: http
      namespace: registry
      description: "Ship registry API"
      baseUri: "https://registry.acme.org"
      resources:
        ships:
          path: "/ships"
          description: "Ships"
          operations:
            get-ship:
              method: GET
  exposes:
    - type: mcp
      port: 3000
      namespace: fleet
      description: "Fleet tools"
      definitions:
        schemas:
          ship:
            type: object
            properties:
              imo: { type: string, format: imo }
              crew:
                type: array
                items:
                  type: object
                  properties:
                    fullName: { type: string }
          odd:
            type: object
            properties:
              "call.sign": { type: string }
          tags:
            type: array
            items: { type: string }
          tree:
            type: object
            properties:
              label: { type: string }
              left: { schema: tree }
              right: { schema: tree }
          record:
            type: object
            properties:
              id: { type: string }
              metadata: { type: object }
          meta: { type: object }
          grid:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      value: { type: number }
      tools:
        unbound-crew:
          description: "Leaves the crew unbound."
          call: registry.get-ship
          outputParameters:
            - schema: ship
              mappings:
                imo: "$.imo_number"
        unknown-path:
          description: "Binds a path the schema does not have."
          call: registry.get-ship
          outputParameters:
            - schema: ship
              mappings:
                imo: "$.imo_number"
                crew: "$.crew"
                crew[].fullName: "$.name"
                flag: "$.flag"
        not-a-json-path:
          description: "Binds a static value."
          call: registry.get-ship
          outputParameters:
            - schema: ship
              mappings:
                imo: "imo_number"
                crew: "$.crew"
                crew[].fullName: "$.name"
        no-mappings:
          description: "References a schema without binding it."
          call: registry.get-ship
          outputParameters:
            - schema: ship
        no-schema:
          description: "Binds no schema."
          call: registry.get-ship
          outputParameters:
            - type: object
              mappings:
                imo: "$.imo_number"
              properties:
                imo: { type: string, mapping: "$.imo" }
        unaddressable:
          description: "Uses a schema with a property a path cannot address."
          call: registry.get-ship
          outputParameters:
            - schema: odd
              mappings:
                imo: "$.imo"
        unbound-array:
          description: "Reads an array schema from nowhere."
          call: registry.get-ship
          outputParameters:
            - type: object
              properties:
                tags:
                  schema: tags
                  mappings:
                    "[]": "$.label"
        cyclic:
          description: "Binds a schema that references itself twice."
          call: registry.get-ship
          outputParameters:
            - schema: tree
              mappings:
                label: "$.label"
        free-form:
          description: "Leaves an object without properties unbound."
          call: registry.get-ship
          outputParameters:
            - schema: record
              mappings:
                id: "$.id"
        object-items-mapping:
          description: "Binds object items, which the runtime reads from each element."
          call: registry.get-ship
          outputParameters:
            - schema: ship
              mappings:
                imo: "$.imo_number"
                crew: "$.crew"
                crew[]: "$.member"
                crew[].fullName: "$.name"
        top-level-mapping:
          description: "Sets a mapping the runtime ignores on an output object."
          call: registry.get-ship
          outputParameters:
            - schema: record
              mapping: "$.record"
              mappings:
                id: "$.id"
                metadata: "$.meta"
        output-free-form:
          description: "Uses an object without properties as the whole output."
          call: registry.get-ship
          outputParameters:
            - schema: meta
              mapping: "$.meta"
        below-nested-arrays:
          description: "Binds a schema below inline nested arrays."
          call: registry.get-ship
          outputParameters:
            - type: array
              mapping: "$.fleets"
              items:
                type: array
                items:
                  schema: record
                  mappings:
                    id: "$.id"
                    metadata: "$.meta"
        nested-in-schema:
          description: "Binds below nested arrays inside a schema."
          call: registry.get-ship
          outputParameters:
            - schema: grid
              mappings:
                rows: "$.rows"
                rows[][].value: "$.v"
        ref-map-form:
          description: "Map-form outputs on a ref tool."
          ref: cargo.get-load
          outputParameters:
            cargo:
              schema: record
        ref-extra-key:
          description: "A key beside schema in a ref tool's mapped output."
          ref: cargo.get-load
          outputParameters:
            labels:
              schema: tags
              description: "The tags."
              mapping: "$.tags"
        ref-json-ref:
          description: "A JSON Schema $ref in a ref tool's mapped output."
          ref: cargo.get-load
          outputParameters:
            labels:
              schema: tags
              $ref: "#/$defs/tags"
              mapping: "$.tags"
      resources:
        flagship:
          display: "Flagship"
          description: "The flagship."
          uri: "data://flagship"
          call: registry.get-ship
          outputParameters:
            - type: object
              properties:
                ship:
                  schema: record
                  mapping: "$.ship"
                  mappings:
                    id: "$.id"
                    metadata: "$.meta"
    - type: rest
      port: 3001
      namespace: fleet-rest
      description: "Fleet API"
      definitions:
        schemas:
          cargo:
            type: object
            properties:
              weight: { type: number }
      resources:
        cargo:
          path: "/cargo"
          description: "Cargo"
          operations:
            get-cargo:
              method: GET
              description: "A mock operation: static outputs only."
              outputParameters:
                - name: cargo
                  schema: cargo
        cargo-ref:
          path: "/cargo-ref"
          description: "Cargo through a flow"
          operations:
            get-cargo-ref:
              method: GET
              description: "Map-form outputs on a ref operation."
              ref: cargo.get-load
              outputParameters:
                cargo:
                  schema: cargo
  aggregates:
    - display: "Cargo"
      namespace: cargo
      definitions:
        schemas:
          load:
            type: object
            properties:
              weight: { type: number }
      flows:
        get-load:
          description: "A mock flow: static outputs only."
          outputParameters:
            load:
              schema: load
