# Spectral fixture — consumed SQL credentials outside username/password.
# MUST FIRE:
#   - ikanos-sql-no-url-credentials, twice: a password in the URL query string,
#       and user:password@ in the URL authority
#   - ikanos-sql-no-inline-credentials, once: a literal connection.properties.password
# MUST NOT FIRE:
#   - ikanos-sql-statement-read-only on a statement that starts with "("
ikanos: "1.0.0-beta10"
info:
  display: "Consumed SQL rules — credentials outside username and password"
  description: "Fixture with database credentials in the URL and in driver properties."
capability:
  consumes:
    - type: sql
      namespace: erp
      description: "ERP database with a password in the URL query string."
      connection:
        url: "jdbc:postgresql://db.internal:5432/erp?user=erp_reader&password=hunter2"
      procedures:
        get-customer:
          description: One customer by id.
          statement: "(select id, name from customers where id = :id)"
          inputParameters:
            id: { type: string }
          outputParameters:
            name: { type: string, value: "$.rows[0].name" }
    - type: sql
      namespace: crm
      description: "CRM database with credentials in the URL authority and in properties."
      connection:
        url: "jdbc:mysql://crm_reader:hunter2@crm.internal:3306/crm"
        properties:
          password: hunter2
      procedures:
        get-account:
          description: One account by id.
          statement: "select id, name from accounts where id = :id"
          inputParameters:
            id: { type: string }
          outputParameters:
            name: { type: string, value: "$.rows[0].name" }
  exposes:
    - type: mcp
      namespace: erp-mcp
      port: 3001
      tools:
        get-customer:
          description: One customer by id.
          hints: { readOnly: true }
          call: erp.get-customer
        get-account:
          description: One account by id.
          hints: { readOnly: true }
          call: crm.get-account
