ikanos: "1.0.0-beta11"
info:
  title: "Mapped definitions budget"
  description: "Bindings that together exceed the expansion budget of their namespace (#1036)."
  tags:
    - Test
capability:
  consumes:
    - type: http
      namespace: registry
      description: "Ship registry API"
      baseUri: "https://registry.acme.org"
      resources:
        ships:
          path: "/ships"
          description: "Ships"
          operations:
            get-grid:
              method: GET
  exposes:
    - type: mcp
      port: 3000
      namespace: grids
      description: "Grid tools"
      definitions:
        schemas:
          deep:
            type: object
            properties:
              grid:
                type: array
                items:
                  type: array
                  items: { schema: level-0 }
          level-0:
            type: object
            properties:
              a: { schema: level-1 }
              b: { schema: level-1 }
          level-1:
            type: object
            properties:
              a: { schema: level-2 }
              b: { schema: level-2 }
          level-2:
            type: object
            properties:
              a: { schema: level-3 }
              b: { schema: level-3 }
          level-3:
            type: object
            properties:
              a: { schema: level-4 }
              b: { schema: level-4 }
          level-4:
            type: object
            properties:
              a: { schema: level-5 }
              b: { schema: level-5 }
          level-5:
            type: object
            properties:
              a: { schema: level-6 }
              b: { schema: level-6 }
          level-6:
            type: object
            properties:
              a: { schema: level-7 }
              b: { schema: level-7 }
          level-7:
            type: object
            properties:
              a: { schema: level-8 }
              b: { schema: level-8 }
          level-8:
            type: object
            properties:
              a: { schema: level-9 }
              b: { schema: level-9 }
          level-9:
            type: object
            properties:
              a: { schema: level-10 }
              b: { schema: level-10 }
          level-10:
            type: object
            properties:
              a: { schema: level-11 }
              b: { schema: level-11 }
          level-11:
            type: object
            properties:
              a: { schema: level-12 }
              b: { schema: level-12 }
          level-12:
            type: object
            properties:
              a: { schema: level-13 }
              b: { schema: level-13 }
          level-13:
            type: object
            properties:
              a: { schema: level-14 }
              b: { schema: level-14 }
          level-14:
            type: object
            properties:
              a: { schema: level-15 }
              b: { schema: level-15 }
          level-15: { type: string }
      tools:
        first-grid:
          description: "Get a grid; each binding stays under the budget alone."
          call: registry.get-grid
          outputParameters:
            - schema: deep
              mappings:
                grid: "$.grid"
        second-grid:
          description: "Get a grid; each binding stays under the budget alone."
          call: registry.get-grid
          outputParameters:
            - schema: deep
              mappings:
                grid: "$.grid"
