# Spectral fixture — consumed SQL rules MUST FIRE:
#   - ikanos-sql-no-inline-credentials, twice: a literal username and a literal password
#   - ikanos-sql-statement-read-only (a DELETE statement)
#   - ikanos-sql-placeholders-bound, twice: a placeholder without an input,
#       and an input the statement never uses
#   - ikanos-sql-stored-procedure-read-only (a stored procedure without readOnly)
#   - ikanos-sql-stored-procedure-parameters, twice: one gap at position 2
#       (positions 1 and 100000: the first gap only), and outParameters on a
#       statement
#   - ikanos-sql-write-statement (a TRUNCATE declared readOnly: false)
#   - ikanos-sql-write-exposure (warn), twice: an MCP tool claiming
#       readOnly and a REST GET, both calling a write procedure
ikanos: "1.0.0-beta10"
info:
  display: "Consumed SQL rules — violations"
  description: "Fixture that violates each consumed SQL Polychro rule."
capability:
  consumes:
    - type: sql
      namespace: erp
      description: "ERP database with literal credentials."
      connection:
        url: "jdbc:postgresql://db.internal:5432/erp"
        username: erp_reader
        password: hunter2
      procedures:
        wipe-customers:
          description: Not a read.
          statement: delete from customers
        get-customer:
          description: One customer by id.
          statement: "select id, name from customers where id = :custId -- :ignored"
          inputParameters:
            customer-id: { type: string, placeholder: customerId }
          outputParameters:
            name: { type: string, value: "$.rows[0].name" }
        get-balance:
          description: Balance of one account, positions 1 and 100000 only.
          storedProcedure: dbo.usp_GetBalance
          inputParameters:
            account-id: { type: string, position: 1 }
          outParameters:
            balance: { position: 100000, sqlType: DECIMAL }
          outputParameters:
            balance: { type: number, value: "$.out.balance" }
        total:
          description: Statements return no OUT parameters.
          statement: select sum(balance) as total from accounts
          outParameters:
            total: { position: 1, sqlType: DECIMAL }
          outputParameters:
            total: { type: number, value: "$.rows[0].total" }
        empty-orders:
          description: Not a row change.
          readOnly: false
          statement: truncate table orders
        mark-shipped:
          description: Marks one paid order as shipped.
          readOnly: false
          statement: update orders set status = 'SHIPPED' where id = :id and status = 'PAID'
          inputParameters:
            id: { type: string }
          outputParameters:
            updated: { type: number, value: "$.rowCount" }
  exposes:
    - type: mcp
      namespace: erp-mcp
      port: 3001
      tools:
        get-customer:
          description: One customer by id.
          hints: { readOnly: true }
          call: erp.get-customer
        mark-shipped:
          description: Marks one order as shipped.
          hints: { readOnly: true }
          call: erp.mark-shipped
    - type: rest
      namespace: erp-rest
      port: 3002
      resources:
        orders:
          path: /orders/{id}/ship
          description: Ship an order.
          operations:
            ship:
              method: GET
              call: erp.mark-shipped
              inputParameters:
                id: { in: path, type: string, description: Order id }
              with:
                id: "{{id}}"
