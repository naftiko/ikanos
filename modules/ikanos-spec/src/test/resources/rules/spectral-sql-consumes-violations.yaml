# Spectral fixture — consumed SQL rules MUST FIRE:
#   - ikanos-sql-no-inline-credentials, twice: a literal username and a literal password
#   - ikanos-sql-statement-read-only (a DELETE statement)
#   - ikanos-sql-placeholders-bound, twice: a placeholder without an input,
#       and an input the statement never uses
ikanos: "1.0.0-beta10"
info:
  display: "Consumed SQL rules — violations"
  description: "Fixture that violates each consumed SQL Polychro rule."
capability:
  consumes:
    - type: sql
      namespace: erp
      description: "ERP database with literal credentials."
      connection:
        url: "jdbc:postgresql://db.internal:5432/erp"
        username: erp_reader
        password: hunter2
      procedures:
        wipe-customers:
          description: Not a read.
          statement: delete from customers
        get-customer:
          description: One customer by id.
          statement: "select id, name from customers where id = :custId -- :ignored"
          inputParameters:
            customer-id: { type: string, placeholder: customerId }
          outputParameters:
            name: { type: string, value: "$.rows[0].name" }
  exposes:
    - type: mcp
      namespace: erp-mcp
      port: 3001
      tools:
        get-customer:
          description: One customer by id.
          hints: { readOnly: true }
          call: erp.get-customer
