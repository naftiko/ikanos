ikanos: 1.0.0-beta9
info:
  display: Durability violations
  description: Negative fixture for the durability rules, under the none mode
capability:
  consumes:
  - type: http
    namespace: port
    description: Port Authority API
    baseUri: https://port.example.com
    resources:
      checks:
        path: /dangerous-goods/checks
        operations:
          check-dangerous-goods:
            method: GET
      slots:
        path: /departure-slots
        operations:
          book-departure-slot:
            method: POST
  aggregates:
  - display: departure flows
    namespace: departure
    flows:
      clear-for-departure:
        description: Task flow under the none mode, asking after a booking
        semantics:
          interaction:
            mode: task
        steps:
          book-slot:
            type: call
            call: port.book-departure-slot
          confirm:
            type: elicit
            message: Confirm the departure
            schema:
              confirmed:
                type: boolean
  exposes:
  - type: mcp
    address: localhost
    port: 9310
    namespace: shipyard-ops
    description: Shipyard operations
    tools:
      clear-for-departure:
        description: Clear a voyage for departure
        ref: departure.clear-for-departure
