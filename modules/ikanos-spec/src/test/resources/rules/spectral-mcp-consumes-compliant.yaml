# Spectral fixture — consumed MCP rules MUST NOT FIRE:
#   HTTPS to a remote host, plain HTTP only to loopback (with and without a port),
#   an endpoint taken whole from a binding, and every consumed tool declares hints.
ikanos: "1.0.0-beta9"
info:
  display: "Consumed MCP rules — compliant"
  description: "Fixture that satisfies every consumed MCP Polychro rule."
capability:
  consumes:
    - type: mcp
      namespace: remote-billing
      description: "Remote MCP server over HTTPS."
      endpoint: https://billing.example.com/mcp
      tools:
        get-invoice:
          description: Retrieve one invoice
          hints: { readOnly: true }
    - type: mcp
      namespace: local-port
      description: "Local MCP sidecar with a port."
      endpoint: http://localhost:8080/mcp
      tools:
        get-invoice:
          description: Retrieve one invoice
          hints: { readOnly: true }
    - type: mcp
      namespace: local-loopback
      description: "Local MCP sidecar on the IPv4 loopback."
      endpoint: http://127.0.0.1/mcp
      tools:
        get-invoice:
          description: Retrieve one invoice
          hints: { readOnly: true }
    - type: mcp
      namespace: local-ipv6
      description: "Local MCP sidecar on the IPv6 loopback."
      endpoint: http://[::1]:9000/mcp
      tools:
        get-invoice:
          description: Retrieve one invoice
          hints: { readOnly: true }
    - type: mcp
      namespace: bound-endpoint
      description: "Endpoint from a binding, checked by the engine at load time."
      endpoint: "{{BILLING_MCP_URL}}"
      tools:
        get-invoice:
          description: Retrieve one invoice
          hints: { readOnly: true }
  exposes:
    - type: mcp
      namespace: billing-mcp
      port: 3001
      tools:
        get-invoice:
          description: Retrieve one invoice
          hints: { readOnly: true }
          call: remote-billing.get-invoice
