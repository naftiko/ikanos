ikanos: 1.0.0-beta9
info:
  display: Pagination violations
  description: >-
    Negative fixture: a POST that pages, a page drain without a page size, and
    a cursor drain whose resolved block has no items path.
capability:
  consumes:
  - type: http
    namespace: registry
    description: Vessel registry API
    baseUri: https://registry.example.com
    resources:
      searches:
        path: /searches
        operations:
          search-voyages:
            method: POST
            pagination:
              style: cursor
              items: $.voyages
              cursor:
                from: $.next
                param: cursor
      voyages:
        path: /voyages
        operations:
          list-voyages:
            method: GET
            pagination:
              style: page
              items: $.data
              page:
                param: page
      cargo:
        path: /cargo
        pagination:
          style: cursor
          cursor:
            from: $.next_cursor
            param: cursor
        operations:
          list-cargo:
            method: GET
  aggregates:
  - display: registry flows
    namespace: registry-flows
    flows:
      list:
        description: Lists the voyages
        steps:
          list:
            type: call
            call: registry.list-voyages
  exposes:
  - type: mcp
    address: localhost
    port: 9319
    namespace: shipyard-registry
    description: Shipyard registry
    tools:
      list:
        description: List the voyages
        ref: registry-flows.list
