ikanos: 1.0.0-beta11
info:
  display: Durability distributed
  description: Positive fixture declaring the distributed durability mode on a shared PostgreSQL store
capability:
  binds:
  - namespace: secrets
    description: Deployment secrets
    keys:
      DURABLE_DB_URL: durable-db-url
      DURABLE_DB_USER: durable-db-user
      DURABLE_DB_PASSWORD: durable-db-password
      IKANOS_SEALING_KEY: ikanos-sealing-key
  aggregates:
  - display: departure flows
    namespace: departure
    flows:
      get-voyage:
        description: Mock voyage lookup
        outputParameters:
          status:
            type: string
            value: planned
  exposes:
  - type: mcp
    address: localhost
    port: 9331
    namespace: shipyard-ops
    description: Shipyard operations
    tools:
      get-voyage:
        description: Get a voyage
        ref: departure.get-voyage
  - type: control
    address: localhost
    port: 9332
    durability:
      mode: distributed
      store:
        type: postgres
        url: "{{secrets.DURABLE_DB_URL}}"
        user: "{{secrets.DURABLE_DB_USER}}"
        password: "{{secrets.DURABLE_DB_PASSWORD}}"
      retention: P7D
      sealingKey: "{{secrets.IKANOS_SEALING_KEY}}"
