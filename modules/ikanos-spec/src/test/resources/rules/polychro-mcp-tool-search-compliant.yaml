# Spectral fixture — no ikanos-mcp-tool-search-* rule MUST FIRE:
#   deferred mode with a description, ten tools, two pinned tools that exist, and no tool named
#   like a meta-tool.
ikanos: "1.0.0-beta11"
info:
  title: "MCP tool search rules — compliant"
  description: "Fixture that satisfies every MCP tool search Polychro rule."
capability:
  consumes:
    - type: http
      namespace: ops-api
      description: "Operations API."
      baseUri: https://api.ops.test
      resources:
        ops:
          path: /v1/ops
          operations:
            read:
              method: GET
  exposes:
    - type: mcp
      namespace: ops
      port: 3001
      description: "Operations tools for incidents, deployments and monitoring."
      toolSearch:
        mode: deferred
        alwaysListed: [get-incident, list-open-incidents]
      tools:
        get-incident:
          description: "Get an incident by id."
          tags: [incidents]
          call: ops-api.read
        list-open-incidents:
          description: "List open incidents."
          tags: [incidents]
          call: ops-api.read
        list-deployments:
          description: "List deployments."
          tags: [deployments]
          call: ops-api.read
        get-deployment-status:
          description: "Get the rollout status of a deployment."
          tags: [deployments]
          call: ops-api.read
        list-pods:
          description: "List pods."
          tags: [kubernetes]
          call: ops-api.read
        get-pod-logs:
          description: "Get the logs of a pod."
          tags: [kubernetes]
          call: ops-api.read
        get-error-rate:
          description: "Get the error rate of a service."
          tags: [monitoring]
          call: ops-api.read
        list-alerts:
          description: "List firing alerts."
          tags: [monitoring]
          call: ops-api.read
        get-on-call:
          description: "Find who is on call."
          tags: [on-call]
          call: ops-api.read
        list-releases:
          description: "List recent releases."
          tags: [releases]
          call: ops-api.read
