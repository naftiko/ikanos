---
# Spectral fixture — ikanos-mcp-trust-loopback-on-public-address MUST FIRE.
#
# 127.1.0.0/16 is inside 127.0.0.0/8 but does not contain 127.0.0.1.
ikanos: "1.0.0-beta8"

info:
  display: "MCP trust — loopback range on a public address"
  description: "Fixture for the MCP trust network rules (issue #483)."

capability:
  exposes:
    - type: "mcp"
      address: "0.0.0.0"
      port: 3001
      namespace: "gateway-mcp"
      description: "MCP server behind an identity-forwarding gateway."
      trust:
        mode: "forwarded"
        agentIdentityHeader: "X-Agent-Id"
        trustedNetworks: ["127.1.0.0/16"]
      tools:
        hello:
          description: "Say hello to the caller."
          outputParameters:
            msg:
              type: "string"
              value: "hi"
