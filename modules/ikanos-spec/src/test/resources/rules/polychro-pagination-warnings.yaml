ikanos: 1.0.0-beta9
info:
  display: Pagination warnings
  description: >-
    Mixed fixture under the none mode: a drain of up to 200 pages (warned), and
    well-formed drains in each style, one resolved from its adapter and
    resource defaults (not reported).
capability:
  consumes:
  - type: http
    namespace: registry
    description: Vessel registry API
    baseUri: https://registry.example.com
    pagination:
      maxPages: 50
    resources:
      cargo:
        path: /voyages/{{voyageId}}/cargo
        pagination:
          style: cursor
          items: $.cargo
          cursor:
            from: $.next_cursor
            param: cursor
        operations:
          list-voyage-cargo:
            method: GET
            pagination:
              maxPages: 200
          list-recent-cargo:
            method: GET
      ships:
        path: /ships
        operations:
          list-ships:
            method: GET
            pagination:
              style: nextLink
              items: $
              nextLink:
                from:
                  header: Link
          list-ships-by-page:
            method: GET
            pagination:
              style: page
              items: $.data
              page:
                param: page
                total: $.meta.total_pages
              pageSize:
                param: per_page
                value: 100
          list-ships-by-offset:
            method: GET
            pagination:
              style: offset
              items: $
              offset:
                param: offset
                total:
                  header: X-Total-Count
              pageSize:
                param: limit
                value: 200
  aggregates:
  - display: registry flows
    namespace: registry-flows
    flows:
      list:
        description: Lists the ships
        steps:
          list:
            type: call
            call: registry.list-ships
  exposes:
  - type: mcp
    address: localhost
    port: 9320
    namespace: shipyard-registry
    description: Shipyard registry
    tools:
      list:
        description: List the ships
        ref: registry-flows.list
