ikanos: 1.0.0-beta9
info:
  display: Aggregate Mappings JSONPath Test
  description: Test capability for JSONPath array indexing in aggregate flow mappings
  tags:
  - Test
  - Aggregate
  created: '2026-10-27'
  modified: '2026-10-27'
capability:
  aggregates:
  - display: Registry
    namespace: registry
    flows:
      first-record:
        description: Return the first and last records of a listing.
        steps:
          list-records:
            type: call
            call: canned.list-records
        mappings:
        - target: first-id
          value: $.list-records.records[0].id
        - target: last-name
          value: $.list-records.records[-1].name
        - target: all-ids
          value: $.list-records.records[*].id
        outputParameters:
          first-id:
            type: number
          last-name:
            type: string
          all-ids:
            type: array
            items:
              type: number
  exposes:
  - type: mcp
    address: localhost
    port: 0
    namespace: registry-mcp
    tools:
      first-record:
        description: Return the first and last records of a listing.
        ref: registry.first-record
  consumes:
  - type: fake
    namespace: canned
    operations:
      list-records:
        outputParameters: []
    responses:
      list-records: '{"records":[{"id":1,"name":"Ada"},{"id":2,"name":"Grace"}]}'
